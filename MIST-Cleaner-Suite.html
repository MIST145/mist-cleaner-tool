  .crumb {

<style>
  :root { --accent:#007bff; --accent-hover:#1a86ff; --danger:#dc2626; --success:#16a34a; --warn:#f59e0b; }

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }

  /* Stats */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }

<div class="container">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8 5.8 21.3l2.4-7.4L2 9.4h7.6z"/></svg>

<script>
/* ============================================================
 * SHX ENGINE - safe detection + cleaning (option A)
 * No dependencies. Works in browser and Node.
 * ============================================================ */
(function (root) {
  "use strict";

  /* ---------- 1. Minimum Lua tokenizer (safe strings/comments) ---------- */
  // Returns a list of segments {t:'code'|'str'|'comment', s:'text'}
  function segment(src) {
    const out = [];
    let i = 0, n = src.length, buf = "";
    const flush = () => { if (buf) { out.push({ t: "code", s: buf }); buf = ""; } };
    const longBracket = (pos) => {
      const m = /^\[(=*)\[/.exec(src.slice(pos, pos + 40));
      return m ? m[1].length : -1;
    };
    while (i < n) {
      const c = src[i];
      if (c === "-" && src[i + 1] === "-") {
        flush();
        const lb = longBracket(i + 2);
        let end;
        if (lb >= 0) {
          const close = "]" + "=".repeat(lb) + "]";
          const k = src.indexOf(close, i + 4 + lb);
          end = k < 0 ? n : k + close.length;
        } else {
          const k = src.indexOf("\n", i);
          end = k < 0 ? n : k;
        }
        out.push({ t: "comment", s: src.slice(i, end) });
        i = end; continue;
      }
      if (c === '"' || c === "'") {
        flush();
        let j = i + 1;
        while (j < n && src[j] !== c) { if (src[j] === "\\") j++; if (src[j] === "\n") break; j++; }
        out.push({ t: "str", s: src.slice(i, j + 1) });
        i = j + 1; continue;
      }
      if (c === "[") {
        const lb = longBracket(i);
        if (lb >= 0) {
          flush();
          const close = "]" + "=".repeat(lb) + "]";
          const k = src.indexOf(close, i + 2 + lb);
          const end = k < 0 ? n : k + close.length;
          out.push({ t: "str", s: src.slice(i, end) });
          i = end; continue;
        }
      }
      buf += c; i++;
    }
    flush();
    return out;
  }

  /* ---------- 2. Detection ---------- */
  const RE_SHX_ID = /\bSHX\d+_\d+\b/g;
  const RE_LABEL = /::SHX_LABEL_\w+::|\bgoto\s+SHX_LABEL_\w+/g;
  const RE_HEADER = /\[AI CLEANUP\]\s*Decompiled Lua/;
  const RE_LOCAL_DECL = /^\s*local\s+SHX\d+_\d+\s*(,\s*SHX\d+_\d+\s*)*$/m;

  function detect(src) {
    // Only counts identifiers OUTSIDE strings/comments
    let ids = 0, labels = 0;
    for (const seg of segment(src)) {
      if (seg.t !== "code") continue;
      ids += (seg.s.match(RE_SHX_ID) || []).length;
      labels += (seg.s.match(RE_LABEL) || []).length;
    }
    const header = RE_HEADER.test(src);
    const decl = RE_LOCAL_DECL.test(src);
    // Criterion: 'local SHXn_m,...' declaration OR (>=5 ids) OR header + >=1 id
    const obfuscated = decl || ids >= 5 || (header && ids >= 1);
    return { obfuscated, ids, labels, header };
  }

  /* ---------- 3. Cleaning ---------- */
  const DECOMP_COMMENT_RE = [
    /^[ \t]*-- \[AI CLEANUP\][^\n]*\n(?:[ \t]*-- \d\.[^\n]*\n)*/gm,
    /^[ \t]*-- \[FIX IF ERROR\][^\n]*\n?/gm,
    /^[ \t]*--\s*\[AI CLEANUP\][^\n]*$/gm,
  ];

  function stripDecompilerNoise(src) {
    let s = src;
    for (const re of DECOMP_COMMENT_RE) s = s.replace(re, "");
    // lines with only spaces left by the header inside functions
    s = s.replace(/^[ \t]+\n/gm, "\n");
    return s;
  }

  // Applies fn only to 'code' parts, preserving strings/comments
  function mapCode(src, fn) {
    return segment(src).map(seg => seg.t === "code" ? fn(seg.s) : seg.s).join("");
  }

  // Removes 'local SHXa, SHXb, ...' (pure declarations without assignment)
  // -> will be re-declared with final names when necessary.
  // Here we only rename; the declaration is kept with the new names.

  const RESERVED = new Set(("and break do else elseif end false for function goto if in local nil not or repeat return then true until while continue").split(" "));

  function collectIdentifiers(src) {
    const set = new Set();
    for (const seg of segment(src)) {
      if (seg.t !== "code") continue;
      const m = seg.s.match(/[A-Za-z_][A-Za-z0-9_]*/g);
      if (m) m.forEach(x => set.add(x));
    }
    return set;
  }

  // Renames SHXn_1 -> g<n> (global/chunk upvalues) and SHXn_2+ -> per function
  // We maintain semantics: 1-to-1 and injective renaming (without collisions).
  function renameIdentifiers(src) {
    const existing = collectIdentifiers(src);
    const used = new Set(existing);
    const map = new Map();
    const pick = (base) => {
      let name = base, k = 2;
      while (used.has(name) || RESERVED.has(name)) name = base + "_" + (k++);
      used.add(name);
      return name;
    };
    return mapCode(src, code => code.replace(/\bSHX(\d+)_(\d+)\b/g, (all, idx, lvl) => {
      if (map.has(all)) return map.get(all);
      // level 1 = file scope; levels >=2 = function scope
      const base = lvl === "1" ? "g" + idx : "v" + idx + (lvl === "2" ? "" : "_l" + lvl);
      const nm = pick(base);
      map.set(all, nm);
      return nm;
    }));
  }

  // Labels: SHX_LABEL_10 -> lbl_10 (kept, only marked for review)
  function renameLabels(src) {
    return mapCode(src, code => code
      .replace(/::SHX_LABEL_(\w+)::/g, "::lbl_$1::")
      .replace(/\bgoto\s+SHX_LABEL_(\w+)/g, "goto lbl_$1"));
  }

  /* ---------- 3a. Fix 'return' followed by code (invalid in Lua) ----------
   * The decompiler emits 'return' in the middle of the block (followed by ::label::).
   * 'do return end' is semantically identical and syntactically valid.
   */
  function fixMidBlockReturn(src) {
    const lines = src.split("\n");
    const isCodeLine = (l) => l.trim() !== "" && !/^\s*--/.test(l);
    for (let i = 0; i < lines.length; i++) {
      const m = /^(\s*)return(\s+[^\n]*?)?\s*$/.exec(lines[i]);
      if (!m) continue;
      let j = i + 1;
      while (j < lines.length && !isCodeLine(lines[j])) j++;
      if (j >= lines.length) continue;
      const nxt = lines[j].trim();
      // 'return' is only valid if the next token closes the block
      if (/^(end|else|elseif|until)\b/.test(nxt)) continue;
      lines[i] = m[1] + "do return" + (m[2] || "") + " end";
    }
    return lines.join("\n");
  }

  /* ---------- 3b. Copy propagation (safe) ----------
   * Decompiler pattern (per line, within the same block):
   *   R = <simple expr>          (global name, literal, field)
   *   R = R.field / R = R(args)   (chains on R)
   * We only collapse 100% safe cases: 'R = X' immediately followed
   * by 'R = R.field' -> 'R = X.field'. And 'R = R(...)'.
   * Everything else remains as is (identical behavior).
   */
  function collapseChains(src) {
    const lines = src.split("\n");
    const out = [];
    const ID = "[A-Za-z_][A-Za-z0-9_]*";
    for (let i = 0; i < lines.length; i++) {
      const cur = lines[i];
      const nxt = lines[i + 1];
      const m1 = new RegExp("^(\\s*)(" + ID + ")\\s*=\\s*(" + ID + "(?:\\.[A-Za-z_]\\w*)*)\\s*$").exec(cur);
      if (m1 && nxt !== undefined) {
        const [, ind, r, rhs] = m1;
        const m2 = new RegExp("^\\s*" + r + "\\s*=\\s*" + r + "((?:\\.[A-Za-z_]\\w*)+)\\s*$").exec(nxt);
        if (m2) { lines[i + 1] = ind + r + " = " + rhs + m2[1]; continue; }
      }
      out.push(cur);
    }
    return out.join("\n");
  }
  function collapseChainsFixpoint(src) {
    let prev, cur = src, guard = 0;
    do { prev = cur; cur = collapseChains(prev); } while (cur !== prev && ++guard < 50);
    return cur;
  }

  /* ---------- 3b2. Temporary register inlining (conservative) ----------
   * Pattern:   R = <simple expr>            (name/field/literal)
   *           R(args)   |   R = R(args)     (immediate call)
   * where R is a decompiler temporary register (v<n>) and the RHS is
   * only name/field (no side effects). Only applies if R is NOT read later
   * in the subsequent lines of the same block before being reassigned.
   * Otherwise, everything remains as is.
   */
  function inlineCalls(src) {
    const lines = src.split("\n");
    const ID = "[A-Za-z_][A-Za-z0-9_]*";
    const isReg = (n) => /^v\d+(_l\d+)?$/.test(n);
    const simple = new RegExp("^(\\s*)(" + ID + ")\\s*=\\s*(" + ID + "(?:\\.[A-Za-z_]\\w*)*)\\s*$");
    const reads = (line, r) => new RegExp("\\b" + r + "\\b").test(line);
    for (let i = 0; i < lines.length - 1; i++) {
      const m = simple.exec(lines[i]);
      if (!m || !isReg(m[2])) continue;
      const [, ind, r, rhs] = m;
      // immediate call: 'R(args)'  (instruction)
      const call = new RegExp("^\\s*" + r + "\\((.*)\\)\\s*$").exec(lines[i + 1]);
      // or 'R = R(args)'
      const call2 = new RegExp("^\\s*" + r + "\\s*=\\s*" + r + "\\((.*)\\)\\s*$").exec(lines[i + 1]);
      const mm = call || call2;
      if (!mm) continue;
      const args = mm[1];
      // args cannot use R (otherwise it would change the meaning)
      if (reads(args, r)) continue;
      // R cannot be read in subsequent lines before a new assignment (at the same level)
      let safe = true;
      const depth0 = (lines[i].match(/^\s*/)[0]).length;
      for (let j = i + 2; j < lines.length && j < i + 40; j++) {
        const L = lines[j];
        const ind2 = (L.match(/^\s*/)[0]).length;
        if (L.trim() === "") continue;
        if (new RegExp("^\\s*" + r + "\\s*=").test(L) && !reads(L.replace(new RegExp("^\\s*" + r + "\\s*="), ""), r)) break; // reassigned without reading
        if (/^\s*(end|else|elseif|until)\b/.test(L) && ind2 < depth0) break;
        if (reads(L, r)) { safe = false; break; }
        if (/^\s*(function|::)/.test(L) || /\bgoto\b/.test(L)) { safe = false; break; }
      }
      if (!safe) continue;
      // result assigned to R (call2) requires R to be read later -> we do not apply
      if (call2) continue;
      lines[i + 1] = ind + rhs + "(" + args + ")";
      lines[i] = null;
      i++;
    }
    return lines.filter(l => l !== null).join("\n");
  }

  /* ---------- 3c. Formatting ---------- */
  function reindent(src) {
    const lines = src.split("\n");
    let depth = 0;
    const OPEN = /^(function\b|local\s+function\b|if\b.*\bthen\s*$|for\b.*\bdo\s*$|while\b.*\bdo\s*$|do\s*$|repeat\s*$)/;
    const out = [];
    let inLong = false;
    for (let raw of lines) {
      if (inLong) { out.push(raw); if (/\]\]/.test(raw)) inLong = false; continue; }
      const t = raw.trim();
      if (t === "") { out.push(""); continue; }
      // multi-line long strings: do not touch
      const lbOpen = /\[=*\[/.test(t) && !/\]=*\]/.test(t.slice(t.search(/\[=*\[/) + 2));
      let d = depth;
      if (/^(end\b|else\b|elseif\b|until\b)/.test(t)) d = Math.max(0, depth - 1);
      out.push("  ".repeat(d) + t);
      if (lbOpen) { inLong = true; continue; }
      // depth adjustment
      if (/^(end\b)/.test(t)) depth = Math.max(0, depth - 1);
      else if (/^(else\b)/.test(t)) { /* mantém */ }
      else if (/^(elseif\b.*\bthen\s*$)/.test(t)) { /* mantém */ }
      else if (/^until\b/.test(t)) depth = Math.max(0, depth - 1);
      else if (OPEN.test(t) || /\bfunction\s*\([^)]*\)\s*$/.test(t)) {
        // 'function(...) ... end' on a single line does not open a block
        if (!/\bend\s*\)?\s*,?\s*$/.test(t) || /^(if|for|while)\b/.test(t) && !/\bend\s*$/.test(t)) depth++;
      } else if (/\bfunction\s*\([^)]*\)\s*$/.test(t)) depth++;
      // lines ending with 'end)' close blocks opened by 'function(' at the end of another line
      if (/^(end\s*[\),]*)$/.test(t) === false && /\bend\s*[\)\},]*\s*$/.test(t) && !/^end\b/.test(t)) {
        // 'x = function() return 1 end' -> no depth change
      }
    }
    return out.join("\n");
  }

  /* ---------- 4. Light validation (block balance) ---------- */
  function validate(src) {
    let opens = 0, closes = 0, paren = 0, brace = 0, brack = 0;
    for (const seg of segment(src)) {
      if (seg.t !== "code") continue;
      const toks = seg.s.match(/[A-Za-z_][A-Za-z0-9_]*|[(){}\[\]]/g) || [];
      // 'for/while ... do' count as 1 block: we count by 'do' (except for the 'do' of for/while ->
      // we use a classic approach: function/if/do/repeat open; end/until close; for/while do not count ('do' counts)
      for (const t of toks) {
        if (t === "function" || t === "if" || t === "do" || t === "repeat") opens++;
        else if (t === "end" || t === "until") closes++;
        else if (t === "(") paren++; else if (t === ")") paren--;
        else if (t === "{") brace++; else if (t === "}") brace--;
        else if (t === "[") brack++; else if (t === "]") brack--;
      }
    }
    // 'elseif' does not open (distinct token), 'then' does not count
    const ok = opens === closes && paren === 0 && brace === 0 && brack === 0;
    return { ok, opens, closes, paren, brace, brack };
  }

  /* ---------- 5. Pipeline ---------- */
  function clean(src, opts) {
    opts = Object.assign({ chains: true, reindent: true, keepLabelsNote: true }, opts || {});
    const before = validate(src);
    let s = src.replace(/\r\n/g, "\n");
    const bytesBefore = s.length;
    s = stripDecompilerNoise(s);
    s = mapCode(s, fixMidBlockReturn);
    if (opts.chains) { s = mapCode(s, collapseChainsFixpoint); s = mapCode(s, inlineCalls); }
    if (opts.reindent) s = reindent(s);
    s = s.replace(/\n{3,}/g, "\n\n").replace(/^\n+/, "");
    if (!s.endsWith("\n")) s += "\n";
    const after = validate(s);
    const gotos = (s.match(/\bgoto\s+SHX_LABEL_\w+/g) || []).length;
    // safety: if block balance worsened -> failure (keeps original)
    const safe = after.ok || (!before.ok && after.opens - after.closes === before.opens - before.closes);
    const bytesSaved = Math.max(0, bytesBefore - s.length);
    return { code: s, safe, before, after, gotos, bytesSaved };
  }

  const api = { detect, clean, validate, segment };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.SHX = api;
})(typeof window !== "undefined" ? window : globalThis);

<script>
"use strict";
/* ============================================================
 * APP — loading (files / folder / ZIP), detection and UI
 * ============================================================ */
const $ = (id) => document.getElementById(id);
const HARD_LIMIT = 8 * 1024 * 1024;         // 8 MB per text file
const MAX_ZIP_DEPTH = 3;                    // ZIPs within ZIPs
const TEXT_EXT = new Set(["lua"]);          // only these are analyzed
const HL_OK = () => typeof hljs !== "undefined" && hljs.getLanguage && hljs.getLanguage("lua");

let entries = [];      // {id,path,name,ext,size,kind,original,bytes,cleaned,info,selected,status,note}
let rootName = "project";
let filter = "all";
let query = "";
let uid = 0;

/* ---------- utilities ---------- */
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function toast(title, desc, variant){
  const c=$("toast-container"), t=document.createElement("div");
  t.className="toast"+(variant?" "+variant:"");
  t.innerHTML=`<div class="toast-title">${esc(title)}</div><div class="toast-desc">${esc(desc)}</div>`;
  c.appendChild(t);
  setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .2s";setTimeout(()=>t.remove(),200);},3200);
}
function downloadBlob(blob, name){
  const u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u);},1000);
}
const ext = (n)=>{ const p=n.split("."); return p.length>1?p.pop().toLowerCase():""; };
const baseName = (p)=>p.split("/").pop();
const tick = ()=>new Promise(r=>setTimeout(r,0));           // cede a UI entre tarefas
function setBar(barId, labelId, wrapId, pct, label){
  $(wrapId).classList.remove("hidden");
  $(barId).style.width=Math.max(0,Math.min(100,pct))+"%";
  $(labelId).textContent=label||"";
}
function normPath(p){ return p.replace(/\\/g,"/").replace(/^\.?\//,"").replace(/\/{2,}/g,"/"); }

/* ---------- read file from browser ---------- */
function readAsText(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsText(file); });
}
function readAsBuffer(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsArrayBuffer(file); });
}

/* ---------- add entry (detects if it's obfuscated .lua) ---------- */
async function addEntry(path, dataBytes /*Uint8Array*/, size){
  path = normPath(path);
  const name = baseName(path), e = ext(name);
  const item = { id:"e"+(uid++), path, name, ext:e, size, bytes:dataBytes, original:null,
                 cleaned:null, info:null, selected:false, status:"copy", note:"" };
  if (TEXT_EXT.has(e) && size <= HARD_LIMIT) {
    // UTF-8 decoding without losing bytes: we keep the original bytes for faithful copy
    const txt = new TextDecoder("utf-8",{fatal:false}).decode(dataBytes);
    item.original = txt;
    item.info = SHX.detect(txt);
    if (item.info.obfuscated) { item.status="obf"; item.selected=true; }
    else item.status="clean";
  }
  entries.push(item);
}

/* ---------- ZIP (recursive) ---------- */
async function ingestZip(buffer, prefix, depth, progress){
  const zip = await JSZip.loadAsync(buffer);
  const files = [];
  zip.forEach((rel, f)=>{ if(!f.dir) files.push([rel,f]); });
  for (let i=0;i<files.length;i++){
    const [rel,f] = files[i];
    const safe = normPath(rel);
    if (safe.split("/").includes("..")) continue;            // protection against zip-slip
    if (/(^|\/)__MACOSX(\/|$)|(^|\/)\.DS_Store$|(^|\/)\.DS_Store$|(^|\/)Thumbs\.db$/i.test(safe)) continue;
    const bytes = await f.async("uint8array");
    const full = prefix ? prefix+"/"+safe : safe;
    if (ext(safe)==="zip" && depth < MAX_ZIP_DEPTH) {
      try { await ingestZip(bytes, full.replace(/\.zip$/i,""), depth+1, progress); continue; } catch(_) {}
    }
    await addEntry(full, bytes, bytes.length);
    if (i%25===0){ progress && progress(i/files.length, rel); await tick(); }
  }
}

/* ---------- load File list (files, folder or zip) ---------- */
async function loadFiles(fileArr){
  fileArr = Array.from(fileArr||[]);
  if (!fileArr.length) return;
  entries = []; uid = 0;
  $("resultsCard").classList.add("hidden"); $("resultList").innerHTML="";
  $("cleanProgress").classList.add("hidden");

  // root name
  const first = fileArr[0];
  const rp = first.webkitRelativePath || first._relativePath || "";
  const isZip0 = fileArr.length===1 && ext(first.name)==="zip";
  rootName = isZip0 ? first.name.replace(/\.zip$/i,"") : (rp.includes("/") ? rp.split("/")[0] : "project");

  try {
    for (let i=0;i<fileArr.length;i++){
      const f = fileArr[i];
      const rel = f.webkitRelativePath || f._relativePath || f.name;
      setBar("loadBar","loadLabel","loadProgress",(i/fileArr.length)*100,`Reading ${i+1}/${fileArr.length}: ${rel}`);
      const buf = await readAsBuffer(f);
      const bytes = new Uint8Array(buf);
      if (ext(f.name)==="zip") {
        const prefix = isZip0 ? "" : rel.replace(/\.zip$/i,"");
        await ingestZip(bytes, prefix, 0, (p,n)=>setBar("loadBar","loadLabel","loadProgress",((i+p)/fileArr.length)*100,`Opening ZIP: ${n}`));
      } else {
        await addEntry(rel, bytes, bytes.length);
      }
      await tick();
    }
  } catch(err){
    toast("Error reading", err.message||String(err), "destructive");
  }
  $("loadProgress").classList.add("hidden");
  if (!entries.length){ toast("No content","No files found.","destructive"); return; }
  // If a ZIP has a single common root folder, keep it (original structure preserved)
  entries.sort((a,b)=>a.path.localeCompare(b.path));
  $("analysisCard").classList.remove("hidden");
  render();
  const o = entries.filter(e=>e.status==="obf").length;
  toast("Analysis complete", `${entries.length} file(s) · ${o} obfuscated detected.`, o?"success":"");
}

/* ---------- Drag & drop (files, folders, zips) ---------- */
function readDirEntry(dir, path, out){
  return new Promise((resolve)=>{
    const rd = dir.createReader(); const all=[];
    const step = ()=> rd.readEntries(async (ents)=>{
      if (!ents.length){
        for (const en of all){
          const p = path ? path+"/"+en.name : en.name;
          if (en.isDirectory) await readDirEntry(en,p,out);
          else await new Promise(r=>en.file(f=>{ f._relativePath=p; out.push(f); r(); }, ()=>r()));
        }
        resolve(); return;
      }
      all.push(...ents); step();
    }, ()=>resolve());
    step();
  });
}

    const ents = Array.from(items).map(i=>i.webkitGetAsEntry()).filter(Boolean);
    for (const en of ents){
      if (en.isDirectory) await readDirEntry(en, en.name, files);
      else await new Promise(r=>en.file(f=>{ f._relativePath=en.name; files.push(f); r(); }, ()=>r()));
    }
  } else files.push(...Array.from(e.dataTransfer.files));

});

/* ---------- Cleaning (only obfuscated) ---------- */
function stripPlainComments(code){
  // removes normal Lua comments (outside strings) — optional
  return SHX.segment(code).map(s=>s.t==="comment"?"":s.s).join("").replace(/[ \t]+$/gm,"").replace(/\n{3,}/g,"\n\n");
}
$("cleanBtn").onclick = async ()=>{
  const targets = entries.filter(e=>e.selected && (e.status==="obf"||e.status==="fail"));
  if (!targets.length) return;

  let ok=0, bad=0;

      e.gotos = r.gotos;
      e.bytesSaved = code.length < e.original.length ? (e.original.length - code.length) : 0;
      if (r.safe) { e.cleaned = code; e.status="done"; ok++; }

/* ---------- Diff (LCS) ---------- */
function computeDiff(a,b){
  const o=a.split("\n"), c=b.split("\n"), m=o.length, n=c.length;
  if (m>3000||n>3000) return null;
  const dp=[]; for(let r=0;r<=m;r++) dp.push(new Uint32Array(n+1));
  for(let r=m-1;r>=0;r--) for(let s=n-1;s>=0;s--)
    dp[r][s]= o[r]===c[s] ? dp[r+1][s+1]+1 : Math.max(dp[r+1][s],dp[r][s+1]);
  const out=[]; let r=0,s=0;
  while(r<m&&s<n){
    if(o[r]===c[s]){out.push({t:"equal",x:o[r]});r++;s++;}
    else if(dp[r+1][s]>=dp[r][s+1]){out.push({t:"removed",x:o[r]});r++;}
    else{out.push({t:"added",x:c[s]});s++;}
  }
  while(r<m){out.push({t:"removed",x:o[r++]});} while(s<n){out.push({t:"added",x:c[s++]});}
  return out;
}
function renderDiff(d){
  if(!d) return '<div style="padding:16px;color:rgba(255,255,255,.45)">File too large for diff (&gt; 3000 lines). Use "View code".</div>';
  return d.map(l=>`<div class="diff-line ${l.t}"><span class="diff-prefix">${l.t==="removed"?"-":l.t==="added"?"+":" "}</span><span class="diff-content">${esc(l.x)}</span></div>`).join("");
}
function highlight(el){
  if(!HL_OK()) return;
  try{ const r=hljs.highlight(el.textContent,{language:"lua"}); el.innerHTML=r.value; el.classList.add("hljs"); }catch(_){}
}

/* ---------- Results ---------- */
function svgCopy(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';}
function renderResults(){
  const list=$("resultList"); list.innerHTML="";
  const done = entries.filter(e=>e.status==="done"), fail = entries.filter(e=>e.status==="fail");
  const totalGotos = done.reduce((a,e)=>a+(e.gotos||0),0);
  const totalBytes = done.reduce((a,e)=>a+(e.bytesSaved||0),0);
  $("resultsSummary").textContent = `${done.length} file(s) cleaned`+(fail.length?` · ${fail.length} original kept`:"")+` · ${entries.length-done.length-fail.length} untouched`
    +(totalGotos?` · ${totalGotos} goto(s) kept`:"")+(totalBytes?` · ~${(totalBytes/1024).toFixed(1)} KB of noise removed`:"");
  for (const f of [...done,...fail]){
    const item=document.createElement("div"); item.className="result-item";
    const h=document.createElement("div"); h.className="result-header";
    const p=document.createElement("span"); p.className="result-path"; p.textContent=f.path; h.appendChild(p);
    if (f.status==="fail"){
      const w=document.createElement("div"); w.className="warn-box"; w.textContent=f.note||"Failed.";
      item.append(h,w); list.appendChild(item); continue;
    }
    const mk=(cls,html)=>{const b=document.createElement("button");b.type="button";b.className="btn btn-sm "+cls;b.innerHTML=html;return b;};
    const vb=mk("btn-outline","View code"), db=mk("btn-outline","View diff"), cb=mk("btn-blue",svgCopy()+" Copy"), dl=mk("btn-green","⬇ Download");
    const cbody=document.createElement("div"); cbody.className="result-body hidden";
    const pre=document.createElement("pre"), code=document.createElement("code"); code.textContent=f.cleaned; pre.appendChild(code); cbody.appendChild(pre);
    const dbody=document.createElement("div"); dbody.className="result-body hidden";
    const dw=document.createElement("div"); dw.className="diff-container"; dbody.appendChild(dw);
    vb.onclick=()=>{const was=cbody.classList.contains("hidden");cbody.classList.toggle("hidden");dbody.classList.add("hidden");
      if(was) highlight(code); vb.textContent=cbody.classList.contains("hidden")?"View code":"Hide code";};
    db.onclick=()=>{const was=dbody.classList.contains("hidden");dbody.classList.toggle("hidden");cbody.classList.add("hidden");
      if(was) dw.innerHTML=renderDiff(computeDiff(f.original,f.cleaned)); db.textContent=dbody.classList.contains("hidden")?"View diff":"Hide diff";};
    cb.onclick=()=>navigator.clipboard.writeText(f.cleaned).then(()=>toast("Copied",f.name,"success"));
    dl.onclick=()=>downloadBlob(new Blob([f.cleaned],{type:"text/plain"}),f.name);
    h.append(vb,db,cb,dl);
    item.append(h);
    if (f.gotos) { const w=document.createElement("div"); w.className="warn-box"; w.textContent=`${f.gotos} goto/label kept (identical behavior to original — not automatically rewritten).`; item.append(w); }
    item.append(cbody,dbody);
    list.appendChild(item);
  }
}

  /* Toast */

<script>
  // ============================================================
  // Shared comment-removal logic
  // ============================================================
  function removeCommentsByExtension(code, extension) {
    if (extension === "lua") {
      let withoutBlock = code.replace(/--\[\[[\s\S]*?\]\]/g, "");
      return withoutBlock
        .split('\n')
        .map((line) => {
          let isInString = false, quoteChar = '', result = '';
          for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if ((char === '"' || char === "'") && (i === 0 || line[i - 1] !== '\\')) {
              if (!isInString) { quoteChar = char; isInString = true; }
              else if (quoteChar === char) { isInString = false; }
              result += char; continue;
            }
            if (!isInString && char === '-' && line[i + 1] === '-') break;
            result += char;
          }
          return result.trim() === "" ? null : result.replace(/\s+$/, '');
        })
        .filter((l) => l !== null)
        .join('\n');
    }
    if (extension === "js" || extension === "ts" || extension === "jsx" || extension === "tsx") {
      let withoutBlock = code.replace(/\/\*[\s\S]*?\*\//g, "");
      return withoutBlock
        .split('\n')
        .map((line) => {
          let isInString = false, quoteChar = '', result = '';
          for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"' || char === "'" || char === "`") {
              if (!isInString) { isInString = true; quoteChar = char; }
              else if (quoteChar === char && line[i - 1] !== '\\') { isInString = false; }
              result += char; continue;
            }
            if (!isInString && char === '/' && line[i + 1] === '/') break;
            result += char;
          }
          return result.trim() === "" ? null : result.replace(/\s+$/, '');
        })
        .filter((l) => l !== null)
        .join('\n');
    }
    if (extension === "py") {
      let withoutBlock = code.replace(/("""|''')[\s\S]*?\1/g, "");
      return withoutBlock
        .split('\n')
        .map((line) => {
          let isInString = false, quoteChar = '', result = '';
          for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if ((char === '"' || char === "'") && (i === 0 || line[i - 1] !== '\\')) {
              if (!isInString) { quoteChar = char; isInString = true; }
              else if (quoteChar === char) { isInString = false; }
              result += char; continue;
            }
            if (!isInString && char === '#') break;
            result += char;
          }
          return result.trim() === "" ? null : result.replace(/\s+$/, '');
        })
        .filter((l) => l !== null)
        .join('\n');
    }
    return code;
  }

  const SUPPORTED_EXTS = ["lua", "js", "ts", "jsx", "tsx", "py"];
  const HARD_LIMIT = 8 * 1024 * 1024; // 8 MB
  const MAX_ZIP_DEPTH = 3;

  function getFileExtension(filename) {
    const parts = filename.split(".");
    return parts.length > 1 ? parts.pop().toLowerCase() : "";
  }

  function showToast(title, description, variant) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast' + (variant === 'destructive' ? ' destructive' : variant === 'success' ? ' success' : '');
    toast.innerHTML = `<div class="toast-title">${title}</div><div class="toast-desc">${description || ''}</div>`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.2s';
      setTimeout(() => toast.remove(), 200);
    }, 3200);
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1000);
  }

  const tick = () => new Promise(r => setTimeout(r, 0));
  function normPath(p) { return p.replace(/\\/g, "/").replace(/^\.?\//, "").replace(/\/{2,}/g, "/"); }
  function baseName(p) { return p.split("/").pop(); }
  function extOf(n) { const p = n.split("."); return p.length > 1 ? p.pop().toLowerCase() : ""; }

  function setBar(barId, labelId, wrapId, pct, label) {
    document.getElementById(wrapId).classList.remove("hidden");
    document.getElementById(barId).style.width = Math.max(0, Math.min(100, pct)) + "%";
    document.getElementById(labelId).textContent = label || "";
  }

  // ============================================================
  // Tabs
  // ============================================================
  const tabButtons = document.querySelectorAll('.tab-btn');
  tabButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      tabButtons.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ============================================================
  // SINGLE FILE / PASTE PANEL
  // ============================================================
  let originalCode = "";
  let cleanedCode = "";
  let ext = "lua";
  let isOriginalMinimized = false;

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const originalCodeInput = document.getElementById('originalCode');
  const cleanBtn = document.getElementById('cleanBtn');
  const resultGrid = document.getElementById('resultGrid');
  const originalPre = document.getElementById('originalPre');
  const originalCodeView = document.getElementById('originalCodeView');
  const originalMinimized = document.getElementById('originalMinimized');
  const toggleMinBtn = document.getElementById('toggleMinBtn');
  const minimizeIcon = document.getElementById('minimizeIcon');
  const cleanedCodeView = document.getElementById('cleanedCodeView');
  const cleanedActions = document.getElementById('cleanedActions');
  const copyBtn = document.getElementById('copyBtn');
  const copyIcon = document.getElementById('copyIcon');
  const copyLabel = document.getElementById('copyLabel');
  const downloadBtn = document.getElementById('downloadBtn');
  const backBtn = document.getElementById('backBtn');

  const ICON_MINIMIZE = minimizeIcon.outerHTML;
  const ICON_MAXIMIZE = '<svg id="minimizeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>';
  const ICON_COPY = copyIcon.outerHTML;
  const ICON_CHECK = '<svg id="copyIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) {
      ext = getFileExtension(file.name);
      const reader = new FileReader();
      reader.onload = (event) => {
        originalCode = event.target.result;
        originalCodeInput.value = originalCode;
      };
      reader.readAsText(file);
    }
  });

  originalCodeInput.addEventListener('input', (e) => { originalCode = e.target.value; });

  cleanBtn.addEventListener('click', () => {
    if (!originalCode.trim()) {
      showToast('Erro', 'Por favor insira algum código para limpar.', 'destructive');
      return;
    }
    try {
      cleanedCode = removeCommentsByExtension(originalCode, ext);
      originalCodeView.textContent = originalCode;
      cleanedCodeView.textContent = cleanedCode;
      resultGrid.classList.remove('hidden');
      cleanedActions.classList.remove('hidden');
      showToast('Sucesso', 'Código limpo com sucesso! Todos os comentários removidos.', 'success');
    } catch (err) {
      showToast('Erro', 'Falha ao limpar o código.', 'destructive');
    }
  });

  toggleMinBtn.addEventListener('click', () => {
    isOriginalMinimized = !isOriginalMinimized;
    if (isOriginalMinimized) {
      originalPre.classList.add('hidden');
      originalMinimized.classList.remove('hidden');
      minimizeIcon.outerHTML = ICON_MAXIMIZE;
    } else {
      originalPre.classList.remove('hidden');
      originalMinimized.classList.add('hidden');
      document.getElementById('minimizeIcon').outerHTML = ICON_MINIMIZE;
    }
  });

  copyBtn.addEventListener('click', () => {
    if (!cleanedCode) return;
    navigator.clipboard.writeText(cleanedCode).then(() => {
      copyIcon.outerHTML = ICON_CHECK;
      copyLabel.textContent = 'Copiado!';
      showToast('Copiado!', 'Código limpo copiado para área de transferência.', 'success');
      setTimeout(() => {
        document.getElementById('copyIcon').outerHTML = ICON_COPY;
        copyLabel.textContent = 'Copiar';
      }, 2000);
    });
  });

  downloadBtn.addEventListener('click', () => {
    if (!cleanedCode) return;
    downloadBlob(new Blob([cleanedCode], { type: 'text/plain' }), 'codigo-limpo.' + ext);
    showToast('Download', 'Código limpo baixado.', 'success');
  });

  backBtn.addEventListener('click', () => { window.parent.postMessage({ type: 'mist-home' }, '*'); });

  // ============================================================
  // FOLDER / ZIP / FILES PANEL — same loading model as SHX
  // ============================================================
  // folderFiles: {id, path, name, ext, supported, original (text|null), bytes (Uint8Array), cleaned (text|null), selected}
  let folderFiles = [];
  let folderRootName = "pasta";
  let uid = 0;

  const folderDropzone = document.getElementById('folderDropzone');
  const filesInput = document.getElementById('filesInput');
  const folderInput = document.getElementById('folderInput');
  const zipInput = document.getElementById('zipInput');
  const folderCard = document.getElementById('folderCard');
  const folderSummary = document.getElementById('folderSummary');
  const fileListEl = document.getElementById('fileList');
  const selectAllBtn = document.getElementById('selectAllBtn');
  const selectNoneBtn = document.getElementById('selectNoneBtn');
  const resetFolderBtn = document.getElementById('resetFolderBtn');
  const cleanFolderBtn = document.getElementById('cleanFolderBtn');
  const folderResultsCard = document.getElementById('folderResultsCard');
  const resultList = document.getElementById('resultList');
  const downloadZipBtn = document.getElementById('downloadZipBtn');

  function readAsBuffer(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.readAsArrayBuffer(file);
    });
  }

  async function addEntry(path, dataBytes, size) {
    path = normPath(path);
    const name = baseName(path);
    const e = extOf(name);
    const supported = SUPPORTED_EXTS.includes(e) && size <= HARD_LIMIT;
    const item = {
      id: "f" + (uid++),
      path,
      name,
      ext: e,
      supported,
      original: null,
      bytes: dataBytes,
      cleaned: null,
      selected: supported
    };
    if (supported) {
      item.original = new TextDecoder("utf-8", { fatal: false }).decode(dataBytes);
    }
    folderFiles.push(item);
  }

  async function ingestZip(buffer, prefix, depth, progress) {
    const zip = await JSZip.loadAsync(buffer);
    const files = [];
    zip.forEach((rel, f) => { if (!f.dir) files.push([rel, f]); });
    for (let i = 0; i < files.length; i++) {
      const [rel, f] = files[i];
      const safe = normPath(rel);
      if (safe.split("/").includes("..")) continue;
      if (/(^|\/)__MACOSX(\/|$)|(^|\/)\.DS_Store$|(^|\/)Thumbs\.db$/i.test(safe)) continue;
      const bytes = await f.async("uint8array");
      const full = prefix ? prefix + "/" + safe : safe;
      if (extOf(safe) === "zip" && depth < MAX_ZIP_DEPTH) {
        try {
          await ingestZip(bytes, full.replace(/\.zip$/i, ""), depth + 1, progress);
          continue;
        } catch (_) {}
      }
      await addEntry(full, bytes, bytes.length);
      if (i % 25 === 0) {
        progress && progress(i / files.length, rel);
        await tick();
      }
    }
  }

  async function loadFiles(fileArr) {
    fileArr = Array.from(fileArr || []);
    if (!fileArr.length) return;
    folderFiles = [];
    uid = 0;
    folderResultsCard.classList.add("hidden");
    resultList.innerHTML = "";

    const first = fileArr[0];
    const rp = first.webkitRelativePath || first._relativePath || "";
    const isZip0 = fileArr.length === 1 && extOf(first.name) === "zip";
    folderRootName = isZip0
      ? first.name.replace(/\.zip$/i, "")
      : (rp.includes("/") ? rp.split("/")[0] : "pasta");

    try {
      for (let i = 0; i < fileArr.length; i++) {
        const f = fileArr[i];
        const rel = f.webkitRelativePath || f._relativePath || f.name;
        setBar("loadBar", "loadLabel", "loadProgress", (i / fileArr.length) * 100, `A ler ${i + 1}/${fileArr.length}: ${rel}`);
        const buf = await readAsBuffer(f);
        const bytes = new Uint8Array(buf);
        if (extOf(f.name) === "zip") {
          const prefix = isZip0 ? "" : rel.replace(/\.zip$/i, "");
          await ingestZip(bytes, prefix, 0, (p, n) =>
            setBar("loadBar", "loadLabel", "loadProgress", ((i + p) / fileArr.length) * 100, `A abrir ZIP: ${n}`)
          );
        } else {
          await addEntry(rel, bytes, bytes.length);
        }
        await tick();
      }
    } catch (err) {
      showToast("Erro a ler", err.message || String(err), "destructive");
    }
    document.getElementById("loadProgress").classList.add("hidden");
    if (!folderFiles.length) {
      showToast("Sem conteúdo", "Nenhum ficheiro encontrado.", "destructive");
      return;
    }
    folderFiles.sort((a, b) => a.path.localeCompare(b.path));
    folderCard.classList.remove("hidden");
    renderFileList();
    const s = folderFiles.filter(f => f.supported).length;
    showToast("Carregamento concluído", `${folderFiles.length} ficheiro(s) · ${s} suportado(s).`, "success");
  }

  /* Drag & drop (files, folders, zips) — same as SHX */
  function readDirEntry(dir, path, out) {
    return new Promise((resolve) => {
      const rd = dir.createReader();
      const all = [];
      const step = () => rd.readEntries(async (ents) => {
        if (!ents.length) {
          for (const en of all) {
            const p = path ? path + "/" + en.name : en.name;
            if (en.isDirectory) await readDirEntry(en, p, out);
            else await new Promise(r => en.file(f => { f._relativePath = p; out.push(f); r(); }, () => r()));
          }
          resolve();
          return;
        }
        all.push(...ents);
        step();
      }, () => resolve());
      step();
    });
  }

  ["dragenter", "dragover"].forEach(ev =>
    folderDropzone.addEventListener(ev, e => { e.preventDefault(); folderDropzone.classList.add("drag-over"); })
  );
  ["dragleave", "drop"].forEach(ev =>
    folderDropzone.addEventListener(ev, e => { e.preventDefault(); folderDropzone.classList.remove("drag-over"); })
  );
  folderDropzone.addEventListener("drop", async (e) => {
    const items = e.dataTransfer.items;
    const files = [];
    if (items && items.length && items[0].webkitGetAsEntry) {
      const ents = Array.from(items).map(i => i.webkitGetAsEntry()).filter(Boolean);
      for (const en of ents) {
        if (en.isDirectory) await readDirEntry(en, en.name, files);
        else await new Promise(r => en.file(f => { f._relativePath = en.name; files.push(f); r(); }, () => r()));
      }
    } else {
      files.push(...Array.from(e.dataTransfer.files));
    }
    loadFiles(files);
  });

  document.getElementById("pickFilesBtn").onclick = () => filesInput.click();
  document.getElementById("pickFolderBtn").onclick = () => folderInput.click();
  document.getElementById("pickZipBtn").onclick = () => zipInput.click();
  [filesInput, folderInput, zipInput].forEach(inp =>
    inp.addEventListener("change", e => { loadFiles(e.target.files); e.target.value = ""; })
  );

  function renderFileList() {
    const supportedCount = folderFiles.filter(f => f.supported).length;
    const selectedCount = folderFiles.filter(f => f.supported && f.selected).length;
    folderSummary.textContent = `${folderFiles.length} ficheiro(s) · ${supportedCount} suportado(s) · ${selectedCount} selecionado(s)`;

    fileListEl.innerHTML = "";
    folderFiles.forEach(f => {
      const row = document.createElement("div");
      row.className = "file-row" + (f.supported ? "" : " unsupported");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = f.selected;
      checkbox.disabled = !f.supported;
      checkbox.addEventListener("change", () => {
        f.selected = checkbox.checked;
        renderFileList();
      });

      const pathSpan = document.createElement("span");
      pathSpan.className = "file-path";
      pathSpan.textContent = f.path;
      pathSpan.title = f.path;

      const badge = document.createElement("span");
      badge.className = "file-badge" + (f.supported ? "" : " copy");
      badge.textContent = f.supported ? ("." + f.ext) : "cópia direta";

      row.appendChild(checkbox);
      row.appendChild(pathSpan);
      row.appendChild(badge);
      fileListEl.appendChild(row);
    });
  }

  selectAllBtn.addEventListener("click", () => {
    folderFiles.forEach(f => { if (f.supported) f.selected = true; });
    renderFileList();
  });
  selectNoneBtn.addEventListener("click", () => {
    folderFiles.forEach(f => { if (f.supported) f.selected = false; });
    renderFileList();
  });
  resetFolderBtn.addEventListener("click", () => {
    folderFiles = [];
    folderCard.classList.add("hidden");
    folderResultsCard.classList.add("hidden");
    resultList.innerHTML = "";
    document.getElementById("loadProgress").classList.add("hidden");
  });

  cleanFolderBtn.addEventListener("click", () => {
    const targets = folderFiles.filter(f => f.supported && f.selected);
    if (targets.length === 0) {
      showToast("Erro", "Selecione ao menos um arquivo suportado para limpar.", "destructive");
      return;
    }
    try {
      targets.forEach(f => {
        f.cleaned = removeCommentsByExtension(f.original, f.ext);
      });
      renderResults();
      folderResultsCard.classList.remove("hidden");
      showToast("Sucesso", targets.length + " ficheiro(s) limpo(s) com sucesso!", "success");
    } catch (err) {
      showToast("Erro", "Falha ao limpar um ou mais arquivos.", "destructive");
    }
  });

  function renderResults() {
    resultList.innerHTML = "";
    const cleanedFiles = folderFiles.filter(f => f.cleaned !== null);
    cleanedFiles.forEach(f => {
      const item = document.createElement("div");
      item.className = "result-item";

      const header = document.createElement("div");
      header.className = "result-header";

      const pathSpan = document.createElement("span");
      pathSpan.className = "result-path";
      pathSpan.textContent = f.path;

      const viewBtn = document.createElement("button");
      viewBtn.className = "btn btn-sm btn-outline";
      viewBtn.textContent = "Ver Código";

      const dlBtn = document.createElement("button");
      dlBtn.className = "btn btn-sm btn-green";
      dlBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Baixar`;
      dlBtn.addEventListener("click", () => {
        downloadBlob(new Blob([f.cleaned], { type: "text/plain" }), f.name);
        showToast("Download", f.name + " baixado.", "success");
      });

      const body = document.createElement("div");
      body.className = "result-body hidden";
      const pre = document.createElement("pre");
      const code = document.createElement("code");
      code.textContent = f.cleaned;
      pre.appendChild(code);
      body.appendChild(pre);

      viewBtn.addEventListener("click", () => {
        body.classList.toggle("hidden");
        viewBtn.textContent = body.classList.contains("hidden") ? "Ver Código" : "Ocultar Código";
      });

      header.appendChild(pathSpan);
      header.appendChild(viewBtn);
      header.appendChild(dlBtn);
      item.appendChild(header);
      item.appendChild(body);
      resultList.appendChild(item);
    });
  }

  downloadZipBtn.addEventListener("click", () => {
    if (typeof JSZip === "undefined") {
      showToast("Erro", "Biblioteca de ZIP não carregou. Verifique sua conexão.", "destructive");
      return;
    }
    if (folderFiles.length === 0) {
      showToast("Erro", "Nenhuma pasta/ZIP carregada.", "destructive");
      return;
    }
    const zip = new JSZip();
    folderFiles.forEach(f => {
      if (f.cleaned !== null) {
        zip.file(f.path, f.cleaned);
      } else {
        zip.file(f.path, f.bytes); // byte-for-byte copy
      }
    });
    zip.generateAsync({ type: "blob", compression: "DEFLATE" }).then(blob => {
      downloadBlob(blob, folderRootName + "-limpo.zip");
      showToast("Download", "ZIP gerado com sucesso.", "success");
    }).catch(() => {
      showToast("Erro", "Falha ao gerar o ZIP.", "destructive");
    });
  });
<\/script>

  .md hr { border:0; border-top:1px solid rgba(255,255,255,.1); margin:1.4em 0; }
  .inspector h3 { margin:0 0 6px 0; font-size:1rem; overflow-wrap:anywhere; }

    font:.8rem/1.6 "JetBrains Mono",Consolas,Monaco,monospace; margin:0; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }

  #toast-container { position:fixed; bottom:24px; right:24px; left:24px; display:flex; flex-direction:column; align-items:flex-end; gap:10px; z-index:1000; pointer-events:none; }

  .toast.destructive { border-color:var(--danger); } .toast.success { border-color:var(--success); }
  .toast-title { font-weight:700; margin-bottom:4px; font-size:.95rem; } .toast-desc { font-size:.85rem; color:rgba(255,255,255,.75); }

  @media (max-width:720px) {
    .fields { grid-template-columns:1fr; }
    .container { padding:32px 12px; }
    h1 { font-size:1.7rem; }
    .meta { display:none; }
  }
</style>

  <div class="header">
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      Bundle Studio
    </h1>
  </div>
  <p class="subtitle">Importa um <b>ZIP</b>, uma pasta ou ficheiros soltos e junta tudo num único documento <b>Markdown</b>, <b>TXT</b> ou <b>PDF</b> (ou reexporta como ZIP). Processamento 100% local no browser, sem enviar nada para servidores.</p>

  <div class="space-y">
    <div class="cyber-glass">
      <div class="dropzone" id="dropzone">
        <svg class="big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <p><b>Arrasta para aqui</b> ficheiros, pastas ou um ZIP</p>

          <button class="btn btn-green" id="downloadTxt" type="button" disabled>⬇ TXT</button>
          <button class="btn btn-red" id="downloadPdf" type="button" disabled>⬇ PDF</button>
          <button class="btn btn-outline" id="copyMd" type="button" disabled>Copiar MD</button>
          <button class="btn btn-outline" id="copyTxt" type="button" disabled>Copiar TXT</button>
