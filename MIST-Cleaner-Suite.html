<div id="toast-container" aria-live="polite"></div>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);

const DEFAULT_PROJECT = "O meu projeto";

const state = {
  files: [],
  selected: new Set(),
  project: DEFAULT_PROJECT,
  activeFile: null,
  markdown: "",
  plainText: "",
  inspectorUrl: null
};

let filterKind = "all";
let busy = false;

const IMAGE_MIME = {
  png:"image/png", jpg:"image/jpeg", jpeg:"image/jpeg",
  gif:"image/gif", webp:"image/webp", bmp:"image/bmp",
  ico:"image/x-icon", avif:"image/avif", tif:"image/tiff",
  tiff:"image/tiff"
};

const LANG = {
  js:"javascript", mjs:"javascript", jsx:"jsx",
  ts:"typescript", tsx:"tsx", py:"python",
  html:"html", htm:"html", css:"css",
  json:"json", md:"markdown", yaml:"yaml",
  yml:"yaml", sql:"sql", sh:"bash", php:"php",
  rs:"rust", go:"go", java:"java", xml:"xml",
  svg:"xml", vue:"vue", svelte:"svelte", lua:"lua"
};

const KIND_LABEL = { text:"texto", image:"imagem", binary:"binário" };

const escapeHtml = value =>
  String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);

const basename = path => path.split("/").pop();

const extension = path => {
  const name = basename(path);
  const i = name.lastIndexOf(".");
  return i > 0 ? name.slice(i + 1).toLowerCase() : "";
};

const formatBytes = bytes => {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
  if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + " MB";
  return (bytes / 1073741824).toFixed(2) + " GB";
};

const tick = () => new Promise(resolve => setTimeout(resolve, 0));

function showToast(title, desc, type) {
  const container = $("toast-container");
  const el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  const t = document.createElement("div");
  t.className = "toast-title";
  t.textContent = title;
  const d = document.createElement("div");
  d.className = "toast-desc";
  d.textContent = desc || "";
  el.appendChild(t);
  if (desc) el.appendChild(d);
  container.appendChild(el);
  setTimeout(() => el.remove(), 3400);
}

/* Import status (top card) */
function istatus(message) {
  $("loadProgress").classList.toggle("hidden", !message);
  $("loadLabel").textContent = message || "";
}
function iprogress(value) {
  $("loadBar").style.width = Math.max(0, Math.min(100, value)) + "%";
}

/* Export status (preview card) */
function xstatus(message) {
  $("exportStatus").classList.toggle("hidden", !message);
  $("exportLabel").textContent = message || "";
}
function xprogress(value) {
  $("exportBar").style.width = Math.max(0, Math.min(100, value)) + "%";
}

/* ---------- Rules / selection ---------- */

function ignoreList() {
  return $("ignoreInput").value.split(",").map(x => x.trim()).filter(Boolean);
}

function passesRules(file, ignore) {
  const parts = file.path.split("/");
  if (!$("optHidden").checked &&
      parts.some(p => p.startsWith(".") && p.length > 1)) return false;
  return !parts.some(p => ignore.includes(p));
}

function selectedFiles() {
  const ignore = ignoreList();
  return state.files.filter(f => state.selected.has(f.id) && passesRules(f, ignore));
}

function sorted(files) {
  const arr = [...files];
  const mode = $("sortSelect").value;

  if (mode === "desc") arr.sort((a, b) => b.path.localeCompare(a.path));
  else if (mode === "size") arr.sort((a, b) => a.size - b.size);
  else if (mode === "type") arr.sort((a, b) => a.ext.localeCompare(b.ext) || a.path.localeCompare(b.path));
  else arr.sort((a, b) => a.path.localeCompare(b.path));

  return arr;
}

function fileIcon(file) {
  if (file.kind === "image") return "🖼️";
  if (file.kind === "binary") return "📦";

  const icons = {
    js:"🟨", html:"🌐", css:"🎨", json:"📋",
    md:"📝", py:"🐍", pdf:"📕", ts:"🔷", lua:"🌙"
  };

  return icons[file.ext] || "📄";
}

function toBase64(bytes) {
  let output = "";
  const chunk = 0x8000;

  for (let i = 0; i < bytes.length; i += chunk) {
    output += String.fromCharCode(...bytes.subarray(i, i + chunk));
  }

  return btoa(output);
}

function base64Lines(bytes) {
  const encoded = toBase64(bytes);
  const lines = [];

  for (let i = 0; i < encoded.length; i += 76) {
    lines.push(encoded.slice(i, i + 76));
  }

  return lines;
}

/* ---------- IMPORT ---------- */

async function ingest(items, label) {
  if (!items.length || busy) return;
  busy = true;

  state.files = [];
  state.selected.clear();
  state.activeFile = null;

  istatus("A ler os ficheiros do projeto…");
  iprogress(0);

  try {
    for (let i = 0; i < items.length; i++) {
      const item = items[i];

      try {
        const bytes = item.bytes ||
          new Uint8Array(await item.file.arrayBuffer());

        const path = (item.path || item.file.name)
          .replace(/^\/+/, "").replace(/\\/g, "/");

        if (!path) continue;

        const ext = extension(path);
        const mime = IMAGE_MIME[ext] || "";

        let kind = "text";
        let text = "";

        if (mime) {
          kind = "image";
        } else if (bytes.subarray(0, Math.min(bytes.length, 8192)).includes(0)) {
          kind = "binary";
        } else {
          try {
            text = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
          } catch (e) {
            text = new TextDecoder("windows-1252").decode(bytes);
          }
        }

        const id = state.files.length;

        state.files.push({
          id, path, ext, kind, size: bytes.length,
          bytes, text, mime: mime || "application/octet-stream"
        });

        state.selected.add(id);
      } catch (error) {
        console.warn("Não foi possível ler o ficheiro", error);
      }

      if (i % 15 === 0) {
        iprogress((i + 1) / items.length * 100);
        istatus("A ler " + (i + 1) + " / " + items.length + " ficheiros…");
        await tick();
      }
    }

    state.project = label || DEFAULT_PROJECT;
    $("projectName").value = state.project;

    render();
    showToast("Importação concluída", state.files.length + " ficheiros importados com sucesso.", "success");
  } catch (error) {
    console.error(error);
    showToast("Erro", "Não foi possível processar o projeto.", "destructive");
  } finally {
    busy = false;
    istatus("");
    iprogress(0);
  }
}

async function loadZip(file) {
  if (!window.JSZip) {
    showToast("Erro", "Biblioteca ZIP indisponível. Verifica a ligação.", "destructive");
    return;
  }

  istatus("A abrir o arquivo ZIP…");

  try {
    const zip = await JSZip.loadAsync(file);
    const entries = [];

    zip.forEach((path, entry) => {
      if (!entry.dir) entries.push({ path, entry });
    });

    const paths = entries.map(e => e.path);
    const root = paths.length ? paths[0].split("/")[0] : "";

    if (root && paths.every(p => p.startsWith(root + "/"))) {
      entries.forEach(e => e.path = e.path.slice(root.length + 1));
    }

    const items = [];

    for (let i = 0; i < entries.length; i++) {
      const e = entries[i];

      try {
        const bytes = await e.entry.async("uint8array");
        items.push({ path: e.path, bytes });
      } catch (error) {
        console.warn("Entrada do ZIP ignorada", e.path, error);
      }

      if (i % 20 === 0) {
        istatus("A extrair " + (i + 1) + " / " + entries.length + "…");
        await tick();
      }
    }

    await ingest(items, file.name.replace(/\.zip$/i, ""));
  } catch (error) {
    console.error(error);
    istatus("");
    showToast("Erro", "Ficheiro ZIP inválido ou ilegível.", "destructive");
  }
}

/* Recursive read of dropped folders */
async function readEntry(entry, prefix, out) {
  if (entry.isFile) {
    const file = await new Promise((res, rej) => entry.file(res, rej));
    out.push({ path: prefix + entry.name, file });
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    let batch;
    do {
      batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      for (const child of batch) {
        await readEntry(child, prefix + entry.name + "/", out);
      }
    } while (batch.length);
  }
}

/* ---------- MARKDOWN EXPORT ---------- */

function buildMarkdown() {
  const files = sorted(selectedFiles());
  const project = $("projectName").value.trim() || DEFAULT_PROJECT;
  const lines = [];

  lines.push("---");
  lines.push("title: " + JSON.stringify(project));
  lines.push("generated: " + new Date().toISOString());
  lines.push("file_count: " + files.length);
  lines.push("---", "");
  lines.push("# " + project, "");
  lines.push("> Gerado em " + new Date().toLocaleString());
  lines.push("> " + files.length + " ficheiros incluídos.", "");

  if ($("optToc").checked) {
    lines.push("## Índice", "");
    files.forEach(f => lines.push("- `" + f.path + "`"));
    lines.push("");
  }

  if ($("optManifest").checked) {
    lines.push("## Manifesto de ficheiros", "");
    lines.push("| Ficheiro | Tipo | Tamanho |");
    lines.push("| --- | --- | --- |");

    files.forEach(f => {
      lines.push("| `" + f.path.replace(/\|/g, "\\|") + "` | " + KIND_LABEL[f.kind] + " | " + formatBytes(f.size) + " |");
    });

    lines.push("");
  }

  for (const f of files) {
    lines.push("---", "");
    lines.push("## `" + f.path + "`", "");

    if (f.kind === "text") {
      if (["md", "markdown", "mdx"].includes(f.ext)) {
        lines.push(f.text);
      } else {
        const matches = f.text.match(/`{3,}/g) || [];
        const fence = "`".repeat(
          Math.max(3, ...matches.map(x => x.length)) + 1
        );

        lines.push(fence + (LANG[f.ext] || ""));
        lines.push(f.text);
        lines.push(fence);
      }
    } else if (f.kind === "image") {
      if ($("optEmbed").checked) {
        const url = "data:" + f.mime + ";base64," + toBase64(f.bytes);
        lines.push("![" + basename(f.path) + "](" + url + ")");
      } else {
        lines.push("Imagem: " + f.path);
      }
    } else if ($("optBinary").checked) {
      lines.push("_Ficheiro binário · " + formatBytes(f.size) + "_", "");
      lines.push("```base64");
      lines.push(...base64Lines(f.bytes));
      lines.push("```");
    } else {
      lines.push("_Ficheiro binário · " + formatBytes(f.size) + " · não incluído_");
    }

    lines.push("");
  }

  return lines.join("\n");
}

/* ---------- PLAIN TEXT EXPORT ---------- */

function buildPlainText() {
  const files = sorted(selectedFiles());
  const project = $("projectName").value.trim() || DEFAULT_PROJECT;
  const lines = [];

  const separator = "=".repeat(76);
  const fileSeparator = "-".repeat(76);

  lines.push(separator);
  lines.push(project.toUpperCase());
  lines.push("BUNDLE DO PROJETO - EXPORTAÇÃO EM TEXTO SIMPLES");
  lines.push(separator);
  lines.push("");
  lines.push("Gerado em: " + new Date().toLocaleString());
  lines.push("Data ISO: " + new Date().toISOString());
  lines.push("Ficheiros incluídos: " + files.length);
  lines.push("");

  if ($("optToc").checked) {
    lines.push(separator);
    lines.push("ÍNDICE");
    lines.push(separator);

    files.forEach((f, i) => {
      lines.push(String(i + 1).padStart(4, "0") + ". " + f.path);
    });

    lines.push("");
  }

  if ($("optManifest").checked) {
    lines.push(separator);
    lines.push("MANIFESTO DE FICHEIROS");
    lines.push(separator);

    files.forEach(f => {
      lines.push(
        f.path +
        " | Tipo: " + KIND_LABEL[f.kind] +
        " | Extensão: " + (f.ext || "nenhuma") +
        " | Tamanho: " + formatBytes(f.size)
      );
    });

    lines.push("");
  }

  lines.push(separator);
  lines.push("CONTEÚDO DOS FICHEIROS");
  lines.push(separator);
  lines.push("");

  for (let i = 0; i < files.length; i++) {
    const f = files[i];

    lines.push(fileSeparator);
    lines.push("FICHEIRO " + (i + 1) + " DE " + files.length);
    lines.push("NOME: " + f.path);
    lines.push("TIPO: " + KIND_LABEL[f.kind].toUpperCase());
    lines.push("TAMANHO: " + formatBytes(f.size));
    lines.push(fileSeparator);
    lines.push("");

    if (f.kind === "text") {
      lines.push("CONTEÚDO:");
      lines.push("");
      lines.push(f.text);
      lines.push("");
    } else if (f.kind === "image") {
      lines.push("FICHEIRO DE IMAGEM");
      lines.push("Nome: " + basename(f.path));
      lines.push("Tipo MIME: " + f.mime);
      lines.push("Tamanho: " + formatBytes(f.size));
      lines.push("O conteúdo binário da imagem não é incluído em texto simples.");
      lines.push("");
    } else {
      lines.push("FICHEIRO BINÁRIO");
      lines.push("Nome: " + basename(f.path));
      lines.push("Tamanho: " + formatBytes(f.size));

      if ($("optBinary").checked) {
        lines.push("");
        lines.push("CONTEÚDO CODIFICADO EM BASE64:");
        lines.push(...base64Lines(f.bytes));
      } else {
        lines.push("Conteúdo binário omitido. Ativa 'Incluir binários em Base64' para o incluir.");
      }

      lines.push("");
    }

    lines.push("");
  }

  lines.push(separator);
  lines.push("FIM DO BUNDLE DO PROJETO");
  lines.push(separator);

  return lines.join("\n");
}

/* ---------- PREVIEW ---------- */

function renderPreview() {
  const hasFiles = selectedFiles().length > 0;

  if (!hasFiles) {
    state.markdown = "";
    state.plainText = "";
    $("raw").textContent = "";
    $("txtPreview").textContent = "O teu documento em texto simples vai aparecer aqui.";
    $("rendered").innerHTML =
      '<div class="empty"><b>Nenhum ficheiro selecionado</b>Seleciona ficheiros no explorador para gerar o documento.</div>';
  } else {
    state.markdown = buildMarkdown();
    state.plainText = buildPlainText();

    $("raw").textContent = state.markdown;
    $("txtPreview").textContent = state.plainText;

    const html = window.marked
      ? marked.parse(state.markdown)
      : "<pre>" + escapeHtml(state.markdown) + "</pre>";

    $("rendered").innerHTML = window.DOMPurify
      ? DOMPurify.sanitize(html)
      : "<pre>" + escapeHtml(state.markdown) + "</pre>";
  }

  ["downloadMd", "downloadTxt", "downloadPdf", "downloadZip", "copyMd", "copyTxt"]
    .forEach(id => { $(id).disabled = !hasFiles; });
}

let previewTimer = null;
function schedulePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(renderPreview, 200);
}

/* ---------- STATISTICS ---------- */

function renderStats() {
  const files = selectedFiles();

  $("totalStat").textContent = files.length;
  $("textStat").textContent = files.filter(f => f.kind === "text").length;
  $("imageStat").textContent = files.filter(f => f.kind === "image").length;

  $("sizeStat").textContent = formatBytes(
    files.reduce((sum, f) => sum + f.size, 0)
  );

  $("fileCount").textContent = files.length + " selecionados de " + state.files.length;
}

/* ---------- FILE EXPLORER ---------- */

function renderFiles() {
  const query = $("searchInput").value.toLowerCase().trim();
  const ignore = ignoreList();

  const files = sorted(state.files).filter(f =>
    f.path.toLowerCase().includes(query) &&
    (filterKind === "all" || f.kind === filterKind)
  );

  if (!state.files.length) {
    $("fileList").innerHTML =
      '<div class="empty"><div class="big-ico">📂</div><b>Nenhum projeto carregado</b>Importa um ZIP, uma pasta ou ficheiros para começar.</div>';
    return;
  }

  if (!files.length) {
    $("fileList").innerHTML =
      '<div class="empty"><b>Nenhum ficheiro corresponde</b>Experimenta outra pesquisa ou filtro.</div>';
    return;
  }

  $("fileList").innerHTML = files.map(f => {
    const ok = passesRules(f, ignore);

    return '<div class="file-row' + (ok ? "" : " dim") + '">' +
      '<input type="checkbox" data-select="' + f.id + '"' +
        (state.selected.has(f.id) ? " checked" : "") +
        ' aria-label="Incluir ' + escapeHtml(f.path) + '">' +
      '<span class="ficon">' + fileIcon(f) + '</span>' +
      '<div class="file-info">' +
        '<div class="fname" title="' + escapeHtml(f.path) + '">' + escapeHtml(basename(f.path)) + '</div>' +
        '<div class="fpath">' + escapeHtml(f.path) + '</div>' +
      '</div>' +
      (ok ? "" : '<span class="badge copy">ignorado</span>') +
      '<span class="badge ' + f.kind + '">' + KIND_LABEL[f.kind] + '</span>' +
      '<span class="meta">' + formatBytes(f.size) + '</span>' +
      '<button class="open-btn" type="button" data-open="' + f.id + '" title="Inspecionar ficheiro">↗</button>' +
    '</div>';
  }).join("");
}

function render() {
  $("work").classList.toggle("hidden", !state.files.length);
  renderStats();
  renderFiles();
  renderPreview();
}

/* ---------- INSPECTOR ---------- */

function inspectFile(id) {
  const f = state.files.find(x => x.id === id);
  if (!f) return;

  state.activeFile = id;

  if (state.inspectorUrl) {
    URL.revokeObjectURL(state.inspectorUrl);
    state.inspectorUrl = null;
  }

  const el = $("inspector");
  el.replaceChildren();

  const heading = document.createElement("h3");
  heading.textContent = f.path;
  el.appendChild(heading);

  const info = document.createElement("p");
  info.textContent = "Tipo: " + KIND_LABEL[f.kind] + " | Tamanho: " + formatBytes(f.size);
  el.appendChild(info);

  if (f.kind === "text") {
    const pre = document.createElement("pre");
    pre.textContent = f.text;
    el.appendChild(pre);
  } else if (f.kind === "image") {
    const image = document.createElement("img");
    image.alt = f.path;
    image.style.maxWidth = "100%";
    image.style.maxHeight = "400px";
    image.style.borderRadius = "10px";

    state.inspectorUrl = URL.createObjectURL(new Blob([f.bytes], { type: f.mime }));
    image.src = state.inspectorUrl;
    el.appendChild(image);
  } else {
    const message = document.createElement("p");
    message.textContent = "Ficheiro binário. A pré-visualização do conteúdo não está disponível.";
    el.appendChild(message);
  }

  activateTab("inspector");
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* ---------- DOWNLOAD HELPERS ---------- */

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function safeFilename() {
  return ($("projectName").value.trim() || "projeto")
    .replace(/[\\/:*?"<>|]+/g, "_")
    .replace(/\s+/g, " ")
    .slice(0, 80);
}

function downloadMarkdown() {
  const content = buildMarkdown();

  download(
    new Blob(["\uFEFF", content], { type: "text/markdown;charset=utf-8" }),
    safeFilename() + ".md"
  );

  showToast("Download", "Markdown exportado com sucesso.", "success");
}

function downloadTxt() {
  const content = buildPlainText();

  download(
    new Blob(["\uFEFF", content], { type: "text/plain;charset=utf-8" }),
    safeFilename() + ".txt"
  );

  showToast("Download", "Texto simples exportado com sucesso.", "success");
}

/* ---------- PDF ---------- */

async function downloadPdf() {
  if (!window.jspdf) {
    showToast("Erro", "Biblioteca PDF indisponível. Verifica a ligação.", "destructive");
    return;
  }

  const button = $("downloadPdf");
  button.disabled = true;
  xprogress(0);
  xstatus("A gerar o PDF…");

  try {
    const { jsPDF } = window.jspdf;
    const files = sorted(selectedFiles());

    const doc = new jsPDF({ unit: "pt", format: "a4", compress: true });

    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 45;
    const maxWidth = pageWidth - margin * 2;
    const bottom = pageHeight - margin;

    let y = margin;

    function ensure(height) {
      if (y + height > bottom) {
        doc.addPage();
        y = margin;
      }
    }

    function write(text, options) {
      options = options || {};
      const size = options.size || 9;
      const font = options.font || "helvetica";
      const style = options.style || "normal";
      const color = options.color || [35, 42, 55];

      doc.setFont(font, style);
      doc.setFontSize(size);
      doc.setTextColor(...color);

      const lines = doc.splitTextToSize(String(text), maxWidth);
      const step = size * 1.45;

      for (const line of lines) {
        ensure(step);
        doc.text(line, margin, y);
        y += step;
      }

      y += (options.after === undefined ? 6 : options.after);
    }

    write($("projectName").value || "Projeto", { size: 21, style: "bold", after: 4 });

    write(
      "Gerado em " + new Date().toLocaleString() + " | " + files.length + " ficheiros",
      { size: 9, color: [120, 130, 145] }
    );

    if ($("optToc").checked) {
      write("ÍNDICE", { size: 13, style: "bold" });
      files.forEach(f => write(f.path, { font: "courier", size: 8, after: 2 }));
    }

    if ($("optManifest").checked) {
      write("MANIFESTO DE FICHEIROS", { size: 13, style: "bold" });
      files.forEach(f => {
        write(
          f.path + " | " + KIND_LABEL[f.kind] + " | " + formatBytes(f.size),
          { font: "courier", size: 7.5, after: 2 }
        );
      });
    }

    for (let i = 0; i < files.length; i++) {
      const f = files[i];

      xstatus("A gerar o PDF: " + (i + 1) + " / " + files.length);
      xprogress((i + 1) / files.length * 100);
      await tick();

      ensure(35);

      doc.setDrawColor(205, 212, 225);
      doc.line(margin, y, pageWidth - margin, y);
      y += 17;

      write(f.path, { font: "courier", style: "bold", size: 9 });

      if (f.kind === "text") {
        const lines = f.text.split("\n").slice(0, 3000);

        for (const line of lines) {
          const wrapped = doc.splitTextToSize(line || " ", maxWidth);

          for (const part of wrapped) {
            ensure(11);
            doc.setFont("courier", "normal");
            doc.setFontSize(7.5);
            doc.setTextColor(45, 50, 60);
            doc.text(part, margin, y);
            y += 10;
          }
        }

        y += 8;
      } else {
        write(
          (f.kind === "image" ? "Ficheiro de imagem | " : "Ficheiro binário | ") + formatBytes(f.size),
          { size: 9, color: [110, 120, 135] }
        );
      }
    }

    const pages = doc.getNumberOfPages();

    for (let p = 1; p <= pages; p++) {
      doc.setPage(p);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      doc.setTextColor(130, 140, 155);
      doc.text(p + " / " + pages, pageWidth / 2, pageHeight - 20, { align: "center" });
    }

    doc.save(safeFilename() + ".pdf");
    showToast("Download", "PDF exportado com sucesso.", "success");
  } catch (error) {
    console.error(error);
    showToast("Erro", "Falha ao gerar o PDF: " + error.message, "destructive");
  } finally {
    xstatus("");
    xprogress(0);
    button.disabled = selectedFiles().length === 0;
  }
}

/* ---------- ZIP ---------- */

async function downloadZip() {
  if (!window.JSZip) {
    showToast("Erro", "Biblioteca ZIP indisponível. Verifica a ligação.", "destructive");
    return;
  }

  const files = selectedFiles();
  if (!files.length) return;

  const zip = new JSZip();
  files.forEach(f => zip.file(f.path, f.bytes));

  const button = $("downloadZip");
  button.disabled = true;
  xprogress(0);
  xstatus("A criar o arquivo ZIP…");

  try {
    const blob = await zip.generateAsync({
      type: "blob",
      compression: "DEFLATE",
      compressionOptions: { level: 6 }
    }, metadata => {
      xprogress(metadata.percent);
      xstatus("A comprimir: " + Math.round(metadata.percent) + "%");
    });

    download(blob, safeFilename() + "-export.zip");
    showToast("Download", "ZIP exportado com sucesso.", "success");
  } catch (error) {
    console.error(error);
    showToast("Erro", "Falha ao gerar o ZIP.", "destructive");
  } finally {
    xstatus("");
    xprogress(0);
    button.disabled = selectedFiles().length === 0;
  }
}

/* ---------- CLIPBOARD ---------- */

async function copyContent(content, message) {
  try {
    await navigator.clipboard.writeText(content);
    showToast("Copiado", message, "success");
  } catch (error) {
    console.error(error);
    showToast("Erro", "Área de transferência indisponível. Seleciona e copia a partir da pré-visualização.", "destructive");
  }
}

/* ---------- TABS ---------- */

function activateTab(target) {
  document.querySelectorAll(".tab-btn").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.tab === target);
  });

  ["rendered", "txtPreview", "raw", "inspector"].forEach(id => {
    $(id).classList.toggle("hidden", id !== target);
  });
}

/* ---------- EVENTS ---------- */

/* Import pickers */
$("pickFilesBtn").addEventListener("click", () => $("filesInput").click());
$("pickFolderBtn").addEventListener("click", () => $("folderInput").click());
$("pickZipBtn").addEventListener("click", () => $("zipInput").click());

$("zipInput").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (file) await loadZip(file);
});

$("folderInput").addEventListener("change", async e => {
  const files = Array.from(e.target.files || []);
  e.target.value = "";

  if (files.length) {
    const items = files.map(f => ({
      path: f.webkitRelativePath || f.name,
      file: f
    }));

    const root = files[0].webkitRelativePath
      ? files[0].webkitRelativePath.split("/")[0]
      : "Pasta";

    await ingest(items, root);
  }
});

$("filesInput").addEventListener("change", async e => {
  const files = Array.from(e.target.files || []);
  e.target.value = "";

  if (files.length) {
    await ingest(files.map(f => ({ path: f.name, file: f })), "Ficheiros selecionados");
  }
});

/* Drag and drop (files, ZIP and whole folders) */
const dropZone = $("dropzone");

dropZone.addEventListener("dragover", e => {
  e.preventDefault();
  dropZone.classList.add("drag-over");
});

dropZone.addEventListener("dragleave", () => {
  dropZone.classList.remove("drag-over");
});

dropZone.addEventListener("drop", async e => {
  e.preventDefault();
  dropZone.classList.remove("drag-over");

  const dt = e.dataTransfer;
  if (!dt) return;

  const entries = Array.from(dt.items || [])
    .map(item => (item.kind === "file" && item.webkitGetAsEntry) ? item.webkitGetAsEntry() : null)
    .filter(Boolean);
  const plainFiles = Array.from(dt.files || []);

  if (plainFiles.length === 1 && /\.zip$/i.test(plainFiles[0].name)) {
    await loadZip(plainFiles[0]);
    return;
  }

  if (entries.length) {
    try {
      istatus("A ler os itens largados…");
      const items = [];
      for (const entry of entries) await readEntry(entry, "", items);

      const label = (entries.length === 1 && entries[0].isDirectory)
        ? entries[0].name
        : "Ficheiros largados";

      await ingest(items, label);
    } catch (error) {
      console.error(error);
      istatus("");
      showToast("Erro", "Não foi possível ler os itens largados.", "destructive");
    }
    return;
  }

  if (plainFiles.length) {
    await ingest(
      plainFiles.map(f => ({ path: f.webkitRelativePath || f.name, file: f })),
      "Ficheiros largados"
    );
  }
});

window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());

/* Explorer */
$("fileList").addEventListener("change", e => {
  if (!e.target.matches("[data-select]")) return;

  const id = Number(e.target.dataset.select);

  if (e.target.checked) state.selected.add(id);
  else state.selected.delete(id);

  renderStats();
  schedulePreview();
  renderFiles();
});

$("fileList").addEventListener("click", e => {
  const button = e.target.closest("[data-open]");
  if (button) inspectFile(Number(button.dataset.open));
});

$("searchInput").addEventListener("input", renderFiles);

$("filters").addEventListener("click", e => {
  const chip = e.target.closest("[data-filter]");
  if (!chip) return;

  filterKind = chip.dataset.filter;
  document.querySelectorAll("#filters .chip").forEach(c => {
    c.classList.toggle("active", c === chip);
  });
  renderFiles();
});

/* Project name / ignore rules / sorting / options */
$("projectName").addEventListener("input", schedulePreview);

$("ignoreInput").addEventListener("input", () => {
  renderStats();
  renderFiles();
  schedulePreview();
});

$("sortSelect").addEventListener("change", render);

["optEmbed", "optToc", "optManifest", "optBinary", "optHidden"].forEach(id => {
  $(id).addEventListener("change", render);
});

/* Selection tools */
$("selectAll").addEventListener("click", () => {
  state.files.forEach(f => state.selected.add(f.id));
  render();
});

$("selectNone").addEventListener("click", () => {
  state.selected.clear();
  render();
});

$("selectInvert").addEventListener("click", () => {
  state.files.forEach(f => {
    if (state.selected.has(f.id)) state.selected.delete(f.id);
    else state.selected.add(f.id);
  });
  render();
});

/* Tabs */
document.querySelectorAll(".tab-btn").forEach(tab => {
  tab.addEventListener("click", () => activateTab(tab.dataset.tab));
});

/* Export buttons */
$("downloadMd").addEventListener("click", downloadMarkdown);
$("downloadTxt").addEventListener("click", downloadTxt);
$("downloadPdf").addEventListener("click", downloadPdf);
$("downloadZip").addEventListener("click", downloadZip);

$("copyMd").addEventListener("click", () => copyContent(buildMarkdown(), "Markdown copiado!"));
$("copyTxt").addEventListener("click", () => copyContent(buildPlainText(), "Texto simples copiado!"));

/* Reset */
$("resetBtn").addEventListener("click", () => {
  if (state.files.length && !confirm("Limpar o projeto atual?")) return;

  clearTimeout(previewTimer);

  if (state.inspectorUrl) {
    URL.revokeObjectURL(state.inspectorUrl);
    state.inspectorUrl = null;
  }

  state.files = [];
  state.selected.clear();
  state.activeFile = null;
  state.markdown = "";
  state.plainText = "";
  filterKind = "all";

  $("searchInput").value = "";
  $("projectName").value = DEFAULT_PROJECT;
  $("inspector").textContent = "Seleciona um ficheiro no explorador para o inspecionar.";
  document.querySelectorAll("#filters .chip").forEach(c => {
    c.classList.toggle("active", c.dataset.filter === "all");
  });

  activateTab("rendered");
  render();
  showToast("Projeto limpo", "Podes importar novos ficheiros.");
});

/* INIT */
$("inspector").textContent = "Seleciona um ficheiro no explorador para o inspecionar.";
render();

})();
<\/script>
</body>
</html></script>

<script>
(function () {
  var APPS = {
    shx: { title: "Cleaner SHX v4", source: "src-shx" },
    comments: { title: "Cleaner (Remove Comentários)", source: "src-comments" },
    bundle: { title: "Bundle Studio", source: "src-bundle" }
  };
  var home = document.getElementById("home");
  var viewer = document.getElementById("viewer");
  var frames = document.getElementById("frames");
  var crumb = document.getElementById("crumbName");
  var built = {};
  var current = null;

  function readSource(id) {
    return document.getElementById(id).textContent.replace(/<\\\/script/g, "<" + "/script");
  }

  function ensureFrame(key) {
    if (built[key]) return built[key];
    var f = document.createElement("iframe");
    f.title = APPS[key].title;
    f.setAttribute("allow", "clipboard-write; clipboard-read");
    f.className = "hidden";
    f.addEventListener("load", function () {
      try {
        f.contentDocument.addEventListener("keydown", function (ev) {
          if (ev.key === "Escape" && current === key) goHome();
        });
      } catch (e) {}
    });
    f.srcdoc = readSource(APPS[key].source);
    frames.appendChild(f);
    built[key] = f;
    return f;
  }

  function showHome() {
    current = null;
    Object.keys(built).forEach(function (k) { built[k].classList.add("hidden"); });
    viewer.classList.add("hidden");
    home.classList.remove("hidden");
    window.scrollTo(0, 0);
  }

  function showApp(key) {
    if (!APPS[key]) { showHome(); return; }
    var f = ensureFrame(key);
    Object.keys(built).forEach(function (k) { built[k].classList.toggle("hidden", k !== key); });
    crumb.textContent = APPS[key].title;
    document.title = APPS[key].title + " — MIST Cleaner Suite";
    home.classList.add("hidden");
    viewer.classList.remove("hidden");
    current = key;
    try { f.focus(); } catch (e) {}
  }

  function route() {
    var key = (location.hash || "").replace("#", "");
    if (APPS[key]) showApp(key);
    else { document.title = "MIST Cleaner Suite"; showHome(); }
  }

  function goApp(key) { location.hash = key; }
  function goHome() {
    if (location.hash) {
      history.pushState("", document.title, location.pathname + location.search);
    }
    route();
  }

  document.getElementById("chooseShx").addEventListener("click", function () { goApp("shx"); });
  document.getElementById("chooseComments").addEventListener("click", function () { goApp("comments"); });
  document.getElementById("chooseBundle").addEventListener("click", function () { goApp("bundle"); });
  document.getElementById("homeBtn").addEventListener("click", goHome);
  window.addEventListener("hashchange", route);
  window.addEventListener("popstate", route);
  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.type === "mist-home") goHome();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && current) goHome();
  });

  route();
})();
</script>
