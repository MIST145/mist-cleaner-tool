</head>

function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function toast(title, desc, variant){
  const c=$("toast-container"), t=document.createElement("div");
  t.className="toast"+(variant?" "+variant:"");
  t.innerHTML=`<div class="toast-title">${esc(title)}</div><div class="toast-desc">${esc(desc)}</div>`;
  c.appendChild(t);
  setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .2s";setTimeout(()=>t.remove(),200);},3200);
}
function downloadBlob(blob, name){
  const u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u);},1000);
}
const ext = (n)=>{ const p=n.split("."); return p.length>1?p.pop().toLowerCase():""; };
const baseName = (p)=>p.split("/").pop();
const tick = ()=>new Promise(r=>setTimeout(r,0));           // yields the UI between tasks
function setBar(barId, labelId, wrapId, pct, label){
  $(wrapId).classList.remove("hidden");
  $(barId).style.width=Math.max(0,Math.min(100,pct))+"%";
  $(labelId).textContent=label||"";
}
function normPath(p){ return p.replace(/\\/g,"/").replace(/^\.?\//,"").replace(/\/{2,}/g,"/"); }

/* ---------- read file from browser ---------- */
function readAsText(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsText(file); });
}
function readAsBuffer(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsArrayBuffer(file); });
}

/* ---------- add entry (detects if it's obfuscated .lua) ---------- */
async function addEntry(path, dataBytes /*Uint8Array*/, size){
  path = normPath(path);
  const name = baseName(path), e = ext(name);
  const item = { id:"e"+(uid++), path, name, ext:e, size, bytes:dataBytes, original:null,
                 cleaned:null, info:null, selected:false, status:"copy", note:"" };
  if (TEXT_EXT.has(e) && size <= HARD_LIMIT) {
    // UTF-8 decoding without losing bytes: we keep the original bytes for faithful copy
    const txt = new TextDecoder("utf-8",{fatal:false}).decode(dataBytes);
    item.original = txt;
    item.info = SHX.detect(txt);
    if (item.info.obfuscated) { item.status="obf"; item.selected=true; }
    else item.status="clean";
  }
  entries.push(item);
}

/* ---------- ZIP (recursive) ---------- */
async function ingestZip(buffer, prefix, depth, progress){
  const zip = await JSZip.loadAsync(buffer);
  const files = [];
  zip.forEach((rel, f)=>{ if(!f.dir) files.push([rel,f]); });
  for (let i=0;i<files.length;i++){
    const [rel,f] = files[i];
    const safe = normPath(rel);
    if (safe.split("/").includes("..")) continue;            // protection against zip-slip
    if (/(^|\/)__MACOSX(\/|$)|(^|\/)\.DS_Store$|(^|\/)\.DS_Store$|(^|\/)Thumbs\.db$/i.test(safe)) continue;
    const bytes = await f.async("uint8array");
    const full = prefix ? prefix+"/"+safe : safe;
    if (ext(safe)==="zip" && depth < MAX_ZIP_DEPTH) {
      try { await ingestZip(bytes, full.replace(/\.zip$/i,""), depth+1, progress); continue; } catch(_) {}
    }
    await addEntry(full, bytes, bytes.length);
    if (i%25===0){ progress && progress(i/files.length, rel); await tick(); }
  }
}

/* ---------- load File list (files, folder or zip) ---------- */
async function loadFiles(fileArr){
  fileArr = Array.from(fileArr||[]);
  if (!fileArr.length) return;
  entries = []; uid = 0;
  $("resultsCard").classList.add("hidden"); $("resultList").innerHTML="";
  $("cleanProgress").classList.add("hidden");

  // root name
  const first = fileArr[0];
  const rp = first.webkitRelativePath || first._relativePath || "";
  const isZip0 = fileArr.length===1 && ext(first.name)==="zip";
  rootName = isZip0 ? first.name.replace(/\.zip$/i,"") : (rp.includes("/") ? rp.split("/")[0] : "project");

  try {
    for (let i=0;i<fileArr.length;i++){
      const f = fileArr[i];
      const rel = f.webkitRelativePath || f._relativePath || f.name;
      setBar("loadBar","loadLabel","loadProgress",(i/fileArr.length)*100,`Reading ${i+1}/${fileArr.length}: ${rel}`);
      const buf = await readAsBuffer(f);
      const bytes = new Uint8Array(buf);
      if (ext(f.name)==="zip") {
        const prefix = isZip0 ? "" : rel.replace(/\.zip$/i,"");
        await ingestZip(bytes, prefix, 0, (p,n)=>setBar("loadBar","loadLabel","loadProgress",((i+p)/fileArr.length)*100,`Opening ZIP: ${n}`));
      } else {
        await addEntry(rel, bytes, bytes.length);
      }
      await tick();
    }
  } catch(err){
    toast("Error reading", err.message||String(err), "destructive");
  }
  $("loadProgress").classList.add("hidden");
  if (!entries.length){ toast("No content","No files found.","destructive"); return; }
  // If a ZIP has a single common root folder, keep it (original structure preserved)
  entries.sort((a,b)=>a.path.localeCompare(b.path));
  $("analysisCard").classList.remove("hidden");
  render();
  const o = entries.filter(e=>e.status==="obf").length;
  toast("Analysis complete", `${entries.length} file(s) · ${o} obfuscated detected.`, o?"success":"");
}

/* ---------- Drag & drop (files, folders, zips) ---------- */
function readDirEntry(dir, path, out){
  return new Promise((resolve)=>{
    const rd = dir.createReader(); const all=[];
    const step = ()=> rd.readEntries(async (ents)=>{
      if (!ents.length){
        for (const en of all){
          const p = path ? path+"/"+en.name : en.name;
          if (en.isDirectory) await readDirEntry(en,p,out);
          else await new Promise(r=>en.file(f=>{ f._relativePath=p; out.push(f); r(); }, ()=>r()));
        }
        resolve(); return;
      }
      all.push(...ents); step();
    }, ()=>resolve());
    step();
  });
}

});

/* ---------- Render: statistics, filters and list ---------- */
function render(){
  const total = entries.length;
  const obf = entries.filter(e=>e.status==="obf"||e.status==="done"||e.status==="fail").length;
  const clean = entries.filter(e=>e.status==="clean").length;
  const other = total-obf-clean;
  $("stats").innerHTML =
    `<div class="stat"><div class="n">${total}</div><div class="l">total files</div></div>
     <div class="stat obf"><div class="n">${obf}</div><div class="l">obfuscated (SHX)</div></div>
     <div class="stat clean"><div class="n">${clean}</div><div class="l">.lua already clean · untouched</div></div>
     <div class="stat other"><div class="n">${other}</div><div class="l">others · direct copy</div></div>`;

  const F = [["all","All"],["obf","Obfuscated"],["clean","Clean"],["copy","Others"]];
  $("filters").innerHTML = F.map(([k,l])=>`<button class="chip ${filter===k?"active":""}" data-f="${k}" type="button">${l}</button>`).join("");
  $("filters").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.f;render();});

  const list = $("fileList"); list.innerHTML="";
  const shown = entries.filter(e=>{
    if (query && !e.path.toLowerCase().includes(query.toLowerCase())) return false;
    if (filter==="all") return true;
    if (filter==="obf") return e.status==="obf"||e.status==="done"||e.status==="fail";
    return e.status===filter;
  });
  if (!shown.length){ list.innerHTML='<div class="file-row dim">No files for this filter.</div>'; }
  for (const e of shown){
    const row=document.createElement("div");
    const isObf = e.status==="obf"||e.status==="done"||e.status==="fail";
    row.className="file-row"+(isObf?"":" dim");
    const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=e.selected; cb.disabled=!isObf;
    cb.onchange=()=>{e.selected=cb.checked;updateCleanBtn();};
    const p=document.createElement("span"); p.className="file-path"; p.textContent=e.path; p.title=e.path;
    const b=document.createElement("span");
    const map={obf:["obf","obfuscated"],clean:["clean","clean · untouched"],copy:["copy","direct copy"],done:["done","clean ✓"],fail:["fail","failed · original kept"]};
    b.className="badge "+map[e.status][0]; b.textContent=map[e.status][1];
    row.append(cb,p);
    if (e.info && e.info.ids) { const m=document.createElement("span"); m.className="meta"; m.textContent=e.info.ids+" refs"; row.append(m); }
    row.append(b);
    list.appendChild(row);
  }
  updateCleanBtn();
}
function updateCleanBtn(){
  const n = entries.filter(e=>e.selected && (e.status==="obf"||e.status==="fail")).length;
  const b=$("cleanBtn"); b.disabled = n===0;
  b.textContent = n? `🧹 Clean ${n} obfuscated file(s)` : "🧹 No obfuscated files to clean";
}

/* ---------- Cleaning (only obfuscated) ---------- */
function stripPlainComments(code){
  // removes normal Lua comments (outside strings) — optional
  return SHX.segment(code).map(s=>s.t==="comment"?"":s.s).join("").replace(/[ \t]+$/gm,"").replace(/\n{3,}/g,"\n\n");
}
$("cleanBtn").onclick = async ()=>{
  const targets = entries.filter(e=>e.selected && (e.status==="obf"||e.status==="fail"));
  if (!targets.length) return;
  const opts = { chains:$("optChains").checked, reindent:$("optIndent").checked };
  $("cleanBtn").disabled = true;
  let ok=0, bad=0;
  for (let i=0;i<targets.length;i++){
    const e = targets[i];
    setBar("cleanBar","cleanLabel","cleanProgress",(i/targets.length)*100,`Cleaning ${i+1}/${targets.length}: ${e.path}`);
    await tick();
    try {
      const r = SHX.clean(e.original, opts);      let code = r.code;
      if ($("optComments").checked) code = stripPlainComments(code);
      e.gotos = r.gotos;
      e.bytesSaved = code.length < e.original.length ? (e.original.length - code.length) : 0;
      if (r.safe) { e.cleaned = code; e.status="done"; ok++; }
      else { e.cleaned = null; e.status="fail"; e.note="Block validation failed — original kept."; bad++; }
    } catch(err){ e.cleaned=null; e.status="fail"; e.note=err.message; bad++; }
  }
  setBar("cleanBar","cleanLabel","cleanProgress",100,`Complete: ${ok} cleaned`+(bad?`, ${bad} failed`:""));
  render(); renderResults();
  $("resultsCard").classList.remove("hidden");
  toast(bad?"Completed with warnings":"Success", `${ok} cleaned`+(bad?` · ${bad} original kept`:""), bad?"destructive":"success");
};

/* ---------- Diff (LCS) ---------- */
function computeDiff(a,b){
  const o=a.split("\n"), c=b.split("\n"), m=o.length, n=c.length;
  if (m>3000||n>3000) return null;
  const dp=[]; for(let r=0;r<=m;r++) dp.push(new Uint32Array(n+1));
  for(let r=m-1;r>=0;r--) for(let s=n-1;s>=0;s--)
    dp[r][s]= o[r]===c[s] ? dp[r+1][s+1]+1 : Math.max(dp[r+1][s],dp[r][s+1]);
  const out=[]; let r=0,s=0;
  while(r<m&&s<n){
    if(o[r]===c[s]){out.push({t:"equal",x:o[r]});r++;s++;}
    else if(dp[r+1][s]>=dp[r][s+1]){out.push({t:"removed",x:o[r]});r++;}
    else{out.push({t:"added",x:c[s]});s++;}
  }
  while(r<m){out.push({t:"removed",x:o[r++]});} while(s<n){out.push({t:"added",x:c[s++]});}
  return out;
}
function renderDiff(d){
  if(!d) return '<div style="padding:16px;color:rgba(255,255,255,.45)">File too large for diff (&gt; 3000 lines). Use "View code".</div>';
  return d.map(l=>`<div class="diff-line ${l.t}"><span class="diff-prefix">${l.t==="removed"?"-":l.t==="added"?"+":" "}</span><span class="diff-content">${esc(l.x)}</span></div>`).join("");
}
function highlight(el){
  if(!HL_OK()) return;
  try{ const r=hljs.highlight(el.textContent,{language:"lua"}); el.innerHTML=r.value; el.classList.add("hljs"); }catch(_){}
}

/* ---------- Results ---------- */
function svgCopy(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';}
function renderResults(){
  const list=$("resultList"); list.innerHTML="";
  const done = entries.filter(e=>e.status==="done"), fail = entries.filter(e=>e.status==="fail");
  const totalGotos = done.reduce((a,e)=>a+(e.gotos||0),0);
  const totalBytes = done.reduce((a,e)=>a+(e.bytesSaved||0),0);
  $("resultsSummary").textContent = `${done.length} file(s) cleaned`+(fail.length?` · ${fail.length} original kept`:"")+` · ${entries.length-done.length-fail.length} untouched`
    +(totalGotos?` · ${totalGotos} goto(s) kept`:"")+(totalBytes?` · ~${(totalBytes/1024).toFixed(1)} KB of noise removed`:"");
  for (const f of [...done,...fail]){
    const item=document.createElement("div"); item.className="result-item";
    const h=document.createElement("div"); h.className="result-header";
    const p=document.createElement("span"); p.className="result-path"; p.textContent=f.path; h.appendChild(p);
    if (f.status==="fail"){
      const w=document.createElement("div"); w.className="warn-box"; w.textContent=f.note||"Failed.";
      item.append(h,w); list.appendChild(item); continue;
    }
    const mk=(cls,html)=>{const b=document.createElement("button");b.type="button";b.className="btn btn-sm "+cls;b.innerHTML=html;return b;};
    const vb=mk("btn-outline","View code"), db=mk("btn-outline","View diff"), cb=mk("btn-blue",svgCopy()+" Copy"), dl=mk("btn-green","⬇ Download");
    const cbody=document.createElement("div"); cbody.className="result-body hidden";
    const pre=document.createElement("pre"), code=document.createElement("code"); code.textContent=f.cleaned; pre.appendChild(code); cbody.appendChild(pre);
    const dbody=document.createElement("div"); dbody.className="result-body hidden";
    const dw=document.createElement("div"); dw.className="diff-container"; dbody.appendChild(dw);
    vb.onclick=()=>{const was=cbody.classList.contains("hidden");cbody.classList.toggle("hidden");dbody.classList.add("hidden");
      if(was) highlight(code); vb.textContent=cbody.classList.contains("hidden")?"View code":"Hide code";};
    db.onclick=()=>{const was=dbody.classList.contains("hidden");dbody.classList.toggle("hidden");cbody.classList.add("hidden");
      if(was) dw.innerHTML=renderDiff(computeDiff(f.original,f.cleaned)); db.textContent=dbody.classList.contains("hidden")?"View diff":"Hide diff";};
    cb.onclick=()=>navigator.clipboard.writeText(f.cleaned).then(()=>toast("Copied",f.name,"success"));
    dl.onclick=()=>downloadBlob(new Blob([f.cleaned],{type:"text/plain"}),f.name);
    h.append(vb,db,cb,dl);
    item.append(h);
    if (f.gotos) { const w=document.createElement("div"); w.className="warn-box"; w.textContent=`${f.gotos} goto/label kept (identical behavior to original — not automatically rewritten).`; item.append(w); }
    item.append(cbody,dbody);
    list.appendChild(item);
  }
}

/* ---------- Report .txt ---------- */
$("reportBtn").onclick = ()=>{
  const done = entries.filter(e=>e.status==="done"), fail = entries.filter(e=>e.status==="fail");
  const lines = [];
  lines.push("Cleaner SHX v4 — Cleaning Report");
  lines.push("Project: "+rootName);
  lines.push("Date: "+new Date().toLocaleString());
  lines.push("");
  lines.push(`Total files: ${entries.length}`);
  lines.push(`Cleaned successfully: ${done.length}`);
  lines.push(`Originals kept (validation failed): ${fail.length}`);
  lines.push(`Untouched (already clean / others): ${entries.length - done.length - fail.length}`);
  lines.push("");
  if (done.length){
    lines.push("--- Cleaned files ---");
    for (const e of done){
      lines.push(`${e.path}  (SHX refs: ${e.info?.ids||0}, goto(s) kept: ${e.gotos||0}, noise removed: ${e.bytesSaved||0} bytes)`);
    }
    lines.push("");
  }
  if (fail.length){
    lines.push("--- Original files kept (review manually) ---");
    for (const e of fail){
      lines.push(`${e.path}  — ${e.note||"failed"}`);
    }
  }
  downloadBlob(new Blob([lines.join("\n")],{type:"text/plain"}), rootName+"-report.txt");
  toast("Report generated", "'.txt' file downloaded.", "success");
};

/* ---------- Final ZIP: original structure; cleaned files replaced ---------- */
$("zipBtn").onclick = async ()=>{
  if (typeof JSZip==="undefined"){ toast("Error","JSZip failed to load (no connection?).","destructive"); return; }
  const zip=new JSZip();
  for (const e of entries){
    if (e.status==="done") zip.file(e.path, e.cleaned);
    else zip.file(e.path, e.bytes);                       // byte-for-byte identical
  }
  try{
    const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE"});
    downloadBlob(blob, rootName+"-clean.zip");
    toast("Download","ZIP generated successfully.","success");
  }catch(err){ toast("Error","Failed to generate ZIP.","destructive"); }
};

    display  .btn-ghost svg { width: 16px; height: 16px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
  }
  @media (min-width: 768px) {
    .grid { grid-template-columns: 1fr auto 1fr; align-items: start; }
  }

  .arrow-col { display: none; align-items: center; justify-content: center; padding-top: 60px; }
  @media (min-width: 768px) { .arrow-col { display: flex; } }
  .arrow-col svg { width: 32px; height: 32px; color: var(--accent); }

  pre {
    background: #2A2F3C;
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 0.85rem;
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 420px;
  }
  code { color: rgba(255,255,255,0.9); font-family: "JetBrains Mono", Consolas, Monaco, monospace; }

  .minimized-box { background: #2A2F3C; padding: 16px; border-radius: 8px; color: rgba(255,255,255,0.5); text-align: center; }

  .abs-top-right { position: absolute; top: 16px; right: 16px; display: flex; gap: 8px; }

  .hidden { display: none !important; }

  /* Folder mode specifics */
  .folder-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .folder-summary { color: rgba(255,255,255,0.65); font-size: 0.9rem; }
  .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .file-list {
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    max-height: 340px;
    overflow-y: auto;
    background: #171f2a;
  }
  .file-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 0.88rem;
  }
  .file-row:last-child { border-bottom: none; }
  .file-row.unsupported { opacity: 0.5; }
  .file-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }
  .file-path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-badge {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(0,123,255,0.15);
    color: var(--accent);
    flex-shrink: 0;
  }
  .file-badge.copy { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); }

  .result-list { display: flex; flex-direction: column; gap: 10px; }
  .result-item {
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    background: #171f2a;
    overflow: hidden;
  }
  .result-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    flex-wrap: wrap;
  }
  .result-path { flex: 1; font-size: 0.88rem; overflow-wrap: anywhere; }
  .result-body { padding: 0 14px 14px 14px; }

  .note { font-size: 0.78rem; color: rgba(255,255,255,0.4); margin-top: 6px; }

  /* Toast */
  #toast-container { position: fixed; bottom: 24px; right: 24px; left: 24px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; z-index: 1000; }
  .toast {
    background: #1c2733;
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 14px 18px;
    min-width: 220px;
    max-width: 320px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    animation: slideIn 0.2s ease-out;
  }
  .toast.destructive { border-color: #dc2626; }
  .toast-title { font-weight: 700; margin-bottom: 4px; font-size: 0.95rem; }
  .toast-desc { font-size: 0.85rem; color: rgba(255,255,255,0.75); }
  @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <button class="back-btn" id="backBtn" title="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8a2 2 0 0 1-1.42-.587l-2.6-2.6a2 2 0 0 1 0-2.83l7.6-7.6a2 2 0 0 1 2.83 0l4.6 4.6a2 2 0 0 1 0 2.83l-4 4"></path><path d="M6 16l3.5 3.5"></path><path d="M2 22l4-4"></path></svg>
      Cleaner (Remove Comments)
    </h1>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="single" id="tabSingleBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
      Single File / Paste
    </button>
    <button class="tab-btn" data-tab="folder" id="tabFolderBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
      Load Folder
    </button>
  </div>

  <!-- ===================== SINGLE FILE / PASTE PANEL ===================== -->
  <div class="panel active" id="panel-single">
    <div class="space-y-8">
      <div class="cyber-glass">
        <h2>Input Code</h2>
        <div class="space-y-4">
          <div class="dropzone" id="dropzone">
            <input type="file" id="fileInput" class="hidden" accept=".lua,.js,.ts,.jsx,.tsx,.py">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <p>Drag or click to upload code file (.lua, .js, .ts, .py, ...)</p>
          </div>
          <div class="or-divider">OR</div>
          <textarea id="originalCode" placeholder="Paste your code here..."></textarea>
          <button class="btn btn-primary" id="cleanBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8a2 2 0 0 1-1.42-.587l-2.6-2.6a2 2 0 0 1 0-2.83l7.6-7.6a2 2 0 0 1 2.83 0l4.6 4.6a2 2 0 0 1 0 2.83l-4 4"></path><path d="M6 16l3.5 3.5"></path><path d="M2 22l4-4"></path></svg>
            Clean Comments
          </button>
        </div>
      </div>

      <div class="grid hidden" id="resultGrid">
        <div class="cyber-glass" style="position:relative;">
          <h3>Original Code</h3>
          <pre id="originalPre"><code id="originalCodeView"></code></pre>
          <div class="minimized-box hidden" id="originalMinimized">Original code minimized</div>
          <button class="btn btn-ghost" id="toggleMinBtn" style="position:absolute; top:16px; right:16px;">
            <svg id="minimizeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
          </button>
        </div>

        <div class="arrow-col">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </div>

        <div class="cyber-glass" style="position:relative;">
          <h3>Cleaned Code</h3>
          <pre><code id="cleanedCodeView"></code></pre>
          <div class="abs-top-right hidden" id="cleanedActions">
            <button class="btn btn-sm btn-blue" id="copyBtn">
              <svg id="copyIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              <span id="copyLabel">Copy</span>
            </button>
            <button class="btn btn-sm btn-green" id="downloadBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Download
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== FOLDER PANEL ===================== -->
  <div class="panel" id="panel-folder">
    <div class="space-y-8">
      <div class="cyber-glass">
        <h2>Load Folder</h2>
        <div class="space-y-4">
          <div class="dropzone" id="folderDropzone">
            <input type="file" id="folderInput" class="hidden" webkitdirectory directory multiple>
            <input type="file" id="filesFallbackInput" class="hidden" multiple accept=".lua,.js,.ts,.jsx,.tsx,.py,*/*">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
            <p>Tap to select a folder from your device</p>
            <p class="hint">Works on desktop and mobile. In some mobile browsers (e.g., iOS Safari), folder selection may open a multi-file picker as an alternative.</p>
          </div>
        </div>
      </div>

      <div class="cyber-glass hidden" id="folderCard">
        <h2 style="margin-bottom:12px;">Loaded Files</h2>
        <div class="folder-toolbar">
          <div class="folder-summary" id="folderSummary"></div>
          <div class="toolbar-actions">
            <button class="btn btn-sm btn-outline" id="selectAllBtn">Select All</button>
            <button class="btn btn-sm btn-outline" id="selectNoneBtn">Clear Selection</button>
          </div>
        </div>
        <div class="file-list" id="fileList"></div>
        <p class="note">Files with a supported extension (.lua, .js, .ts, .jsx, .tsx, .py) can be selected for cleaning. The others will be copied unchanged into the final ZIP.</p>
        <div style="margin-top:16px;">
          <button class="btn btn-primary" id="cleanFolderBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8a2 2 0 0 1-1.42-.58        .map((line) => {
          let isInString = false, quoteChar = '', result = '';
          for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if ((char === '"' || char === "'") && (i === 0 || line[i - 1] !== '\\')) {
              if (!isInString) { quoteChar = char; isInString = true; }
              else if (quoteChar === char) { isInString = false; }
              result += char; continue;
            }
            if (!isInString && char === '-' && line[i + 1] === '-') break;
            result += char;
          }
          return result.trim() === "" ? null : result.replace(/\s+$/, '');
        })
        .filter((l) => l !== null)
        .join('\n');
    }
    if (extension === "js" || extension === "ts" || extension === "jsx" || extension === "tsx") {
      let withoutBlock = code.replace(/\/\*[\s\S]*?\*\//g, "");
      return withoutBlock
        .split('\n')
        .map((line) => {
          let isInString = false, quoteChar = '', result = '';
          for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"' || char === "'" || char === "`") {
              if (!isInString) { isInString = true; quoteChar = char; }
              else if (quoteChar === char && line[i - 1] !== '\\') { isInString = false; }
              result += char; continue;
            }
            if (!isInString && char === '/' && line[i + 1] === '/') break;
            result += char;
          }
          return result.trim() === "" ? null : result.replace(/\s+$/, '');
        })
        .filter((l) => l !== null)
        .join('\n');
    }
    if (extension === "py") {
      let withoutBlock = code.replace(/("""|''')[\s\S]*?\1/g, "");
      return withoutBlock
        .split('\n')
        .map((line) => {
          let isInString = false, quoteChar = '', result = '';
          for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if ((char === '"' || char === "'") && (i === 0 || line[i - 1] !== '\\')) {
              if (!isInString) { quoteChar = char; isInString = true; }
              else if (quoteChar === char) { isInString = false; }
              result += char; continue;
            }
            if (!isInString && char === '#') break;
            result += char;
          }
          return result.trim() === "" ? null : result.replace(/\s+$/, '');
        })
        .filter((l) => l !== null)
        .join('\n');
    }
    return code;
  }

  const SUPPORTED_EXTS = ["lua", "js", "ts", "jsx", "tsx", "py"];

  function getFileExtension(filename) {
    const parts = filename.split(".");
    return parts.length > 1 ? parts.pop().toLowerCase() : "lua";
  }

  function showToast(title, description, variant) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast' + (variant === 'destructive' ? ' destructive' : '');
    toast.innerHTML = `<div class="toast-title">${title}</div><div class="toast-desc">${description}</div>`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.2s';
      setTimeout(() => toast.remove(), 200);
    }, 3000);
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 0);
  }

  // ============================================================
  // Tabs
  // ============================================================
  const tabButtons = document.querySelectorAll('.tab-btn');
  tabButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      tabButtons.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ============================================================
  // SINGLE FILE / PASTE PANEL (same behaviour as before)
  // ============================================================
  let originalCode = "";
  let cleanedCode = "";
  let ext = "lua";
  let isOriginalMinimized = false;

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const originalCodeInput = document.getElementById('originalCode');
  const cleanBtn = document.getElementById('cleanBtn');
  const resultGrid = document.getElementById('resultGrid');
  const originalPre = document.getElementById('originalPre');
  const originalCodeView = document.getElementById('originalCodeView');
  const originalMinimized = document.getElementById('originalMinimized');
  const toggleMinBtn = document.getElementById('toggleMinBtn');
  const minimizeIcon = document.getElementById('minimizeIcon');
  const cleanedCodeView = document.getElementById('cleanedCodeView');
  const cleanedActions = document.getElementById('cleanedActions');
  const copyBtn = document.getElementById('copyBtn');
  const copyIcon = document.getElementById('copyIcon');
  const copyLabel = document.getElementById('copyLabel');
  const downloadBtn = document.getElementById('downloadBtn');
  const backBtn = document.getElementById('backBtn');

  const ICON_MINIMIZE = minimizeIcon.outerHTML;
  const ICON_MAXIMIZE = '<svg id="minimizeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>';
  const ICON_COPY = copyIcon.outerHTML;
  const ICON_CHECK = '<svg id="copyIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) {
      ext = getFileExtension(file.name);
      const reader = new FileReader();
      reader.onload = (event) => {
        originalCode = event.target.result;
        originalCodeInput.value = originalCode;
      };
      reader.readAsText(file);
    }
  });

  originalCodeInput.addEventListener('input', (e) => { originalCode = e.target.value; });

  cleanBtn.addEventListener('click', () => {
    if (!originalCode.trim()) {
      showToast('Error', 'Please enter some code to clean.', 'destructive');
      return;
    }
    try {
      cleanedCode = removeCommentsByExtension(originalCode, ext);
      originalCodeView.textContent = originalCode;
      cleanedCodeView.textContent = cleanedCode;
      resultGrid.classList.remove('hidden');
      cleanedActions.classList.remove('hidden');
      showToast('Success', 'Code cleaned successfully! All comments removed.');
    } catch (err) {
      showToast('Error', 'Failed to clean the code.', 'destructive');
    }
  });

  toggleMinBtn.addEventListener('click', () => {
    isOriginalMinimized = !isOriginalMinimized;
    if (isOriginalMinimized) {
      originalPre.classList.add('hidden');
      originalMinimized.classList.remove('hidden');
      minimizeIcon.outerHTML = ICON_MAXIMIZE;
    } else {
      originalPre.classList.remove('hidden');
      originalMinimized.classList.add('hidden');
      document.getElementById('minimizeIcon').outerHTML = ICON_MINIMIZE;
    }
  });

  copyBtn.addEventListener('click', () => {
    if (!cleanedCode) return;
    navigator.clipboard.writeText(cleanedCode).then(() => {
      copyIcon.outerHTML = ICON_CHECK;
      copyLabel.textContent = 'Copied!';
      showToast('Copied!', 'Cleaned code copied to clipboard.');
      setTimeout(() => {
        document.getElementById('copyIcon').outerHTML = ICON_COPY;
        copyLabel.textContent = 'Copy';
      }, 2000);
    });
  });

  downloadBtn.addEventListener('click', () => {
    if (!cleanedCode) return;
    downloadBlob(new Blob([cleanedCode], { type: 'text/plain' }), 'clean-code.' + ext);
    showToast('Download', 'Cleaned code downloaded.');
  });

  backBtn.addEventListener('click', () => { window.parent.postMessage({ type: 'mist-home' }, '*'); });

  // ============================================================
  // FOLDER PANEL
  // ============================================================
  // folderFiles: array of {id, path, name, ext, supported, original (text|null), buffer (ArrayBuffer|null), cleaned (text|null), selected (bool)}
  let folderFiles = [];
  let folderRootName = "folder";

  const folderDropzone = document.getElementById('folderDropzone');
  const folderInput = document.getElementById('folderInput');
  const filesFallbackInput = document.getElementById('filesFallbackInput');
  const folderCard = document.getElementById('folderCard');
  const folderSummary = document.getElementById('folderSummary');
  const fileListEl = document.getElementById('fileList');
  const selectAllBtn = document.getElementById('selectAllBtn');
  const selectNoneBtn = document.getElementById('selectNoneBtn');
  const cleanFolderBtn = document.getElementById('cleanFolderBtn');
  const folderResultsCard = document.getElementById('folderResultsCard');
  const resultList = document.getElementById('resultList');
  const downloadZipBtn = document.getElementById('downloadZipBtn');

  // Detect whether directory selection actually works; fall back to a plain
  // multi-file picker on platforms (like iOS Safari) that ignore it.
  function supportsDirectoryPicker() {
    const testInput = document.createElement('input');
    return 'webkitdirectory' in testInput;
  }

  folderDropzone.addEventListener('click', () => {
    if (supportsDirectoryPicker()) {
      folderInput.click();
    } else {
      filesFallbackInput.click();
    }
  });

  folderInput.addEventListener('change', (e) => handleFileList(e.target.files));
  filesFallbackInput.addEventListener('change', (e) => handleFileList(e.target.files));

  function handleFileList(fileListRaw) {
    const rawFiles = Array.from(fileListRaw || []);
    if (rawFiles.length === 0) return;

    folderFiles = [];
    folderRootName = "folder";

    const firstPath = rawFiles[0].webkitRelativePath || rawFiles[0].name;
    if (firstPath.includes('/')) {
      folderRootName = firstPath.split('/')[0];
    }

    const readPromises = rawFiles.map((file, idx) => {
      const relPath = file.webkitRelativePath || file.name;
      const extension = getFileExtension(file.name);
      const supported = SUPPORTED_EXTS.includes(extension);

      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const entry = {
            id: 'f' + idx + '_' + Date.now(),
            path: relPath,
            name: file.name,
            ext: extension,
            supported: supported,
            original: supported ? ev.target.result : null,
            buffer: supported ? null : ev.target.result,
            cleaned: null,
            selected: supported,
          };
          resolve(entry);
        };
        reader.onerror = () => {
          resolve({
            id: 'f' + idx + '_' + Date.now(),
            path: relPath,
            name: file.name,
            ext: extension,
            supported: false,
            original: null,
            buffer: null,
            cleaned: null,
            selected: false,
            error: true,
          });
        };
        if (supported) {
          reader.readAsText(file);
        } else {
          reader.readAsArrayBuffer(file);
        }      });
    });

    Promise.all(readPromises).then((entries) => {
      folderFiles = entries;
      folderResultsCard.classList.add('hidden');
      resultList.innerHTML = '';
      renderFileList();
      folderCard.classList.remove('hidden');
      showToast('Folder loaded', folderFiles.length + ' file(s) found.');
    });
  }

  function renderFileList() {
    const supportedCount = folderFiles.filter((f) => f.supported).length;
    const selectedCount = folderFiles.filter((f) => f.supported && f.selected).length;
    folderSummary.textContent = `${folderFiles.length} file(s) in total · ${supportedCount} supported · ${selectedCount} selected`;

    fileListEl.innerHTML = '';
    folderFiles.forEach((f) => {
      const row = document.createElement('div');
      row.className = 'file-row' + (f.supported ? '' : ' unsupported');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = f.selected;
      checkbox.disabled = !f.supported;
      checkbox.addEventListener('change', () => {
        f.selected = checkbox.checked;
        renderFileList();
      });

      const pathSpan = document.createElement('span');
      pathSpan.className = 'file-path';
      pathSpan.textContent = f.path;
      pathSpan.title = f.path;

      const badge = document.createElement('span');
      badge.className = 'file-badge' + (f.supported ? '' : ' copy');
      badge.textContent = f.supported ? ('.' + f.ext) : 'direct copy';

      row.appendChild(checkbox);
      row.appendChild(pathSpan);
      row.appendChild(badge);
      fileListEl.appendChild(row);
    });
  }

  selectAllBtn.addEventListener('click', () => {
    folderFiles.forEach((f) => { if (f.supported) f.selected = true; });
    renderFileList();
  });

  selectNoneBtn.addEventListener('click', () => {
    folderFiles.forEach((f) => { if (f.supported) f.selected = false; });
    renderFileList();
  });

  cleanFolderBtn.addEventListener('click', () => {
    const targets = folderFiles.filter((f) => f.supported && f.selected);
    if (targets.length === 0) {
      showToast('Error', 'Select at least one supported file to clean.', 'destructive');
      return;
    }
    try {
      targets.forEach((f) => {
        f.cleaned = removeCommentsByExtension(f.original, f.ext);
      });
      renderResults();
      folderResultsCard.classList.remove('hidden');
      showToast('Success', targets.length + ' file(s) successfully cleaned!');
    } catch (err) {
      showToast('Error', 'Failed to clean one or more files.', 'destructive');
    }
  });

  function renderResults() {
    resultList.innerHTML = '';
    const cleanedFiles = folderFiles.filter((f) => f.cleaned !== null);
    cleanedFiles.forEach((f) => {
      const item = document.createElement('div');
      item.className = 'result-item';

      const header = document.createElement('div');
      header.className = 'result-header';

      const pathSpan = document.createElement('span');
      pathSpan.className = 'result-path';
      pathSpan.textContent = f.path;

      const viewBtn = document.createElement('button');
      viewBtn.className = 'btn btn-sm btn-outline';
      viewBtn.textContent = 'View Code';

      const dlBtn = document.createElement('button');
      dlBtn.className = 'btn btn-sm btn-green';
      dlBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Download`;
      dlBtn.addEventListener('click', () => {
        downloadBlob(new Blob([f.cleaned], { type: 'text/plain' }), f.name);
        showToast('Download', f.name + ' downloaded.');
      });

      const body = document.createElement('div');
      body.className = 'result-body hidden';
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.textContent = f.cleaned;
      pre.appendChild(code);
      body.appendChild(pre);

      viewBtn.addEventListener('click', () => {
        body.classList.toggle('hidden');
        viewBtn.textContent = body.classList.contains('hidden') ? 'View Code' : 'Hide Code';
      });

      header.appendChild(pathSpan);
      header.appendChild(viewBtn);
      header.appendChild(dlBtn);
      item.appendChild(header);
      item.appendChild(body);
      resultList.appendChild(item);
    });
  }

  downloadZipBtn.addEventListener('click', () => {
    if (typeof JSZip === 'undefined') {
      showToast('Error', 'ZIP library failed to load. Check your connection.', 'destructive');
      return;
    }
    if (folderFiles.length === 0) {
      showToast('Error', 'No folder loaded.', 'destructive');
      return;
    }
    const zip = new JSZip();
    folderFiles.forEach((f) => {
      const content = f.cleaned !== null ? f.cleaned : (f.supported ? f.original : f.buffer);
      zip.file(f.path, content);
    });
    zip.generateAsync({ type: 'blob' }).then((blob) => {
      downloadBlob(blob, folderRootName + '-cleaned.zip');
      showToast('Download', 'ZIP successfully generated.');
    }).catch(() => {
      showToast('Error', 'Failed to generate the ZIP.', 'destructive');
    });
  });
<\/script>

</body>

<script>
(function () {
  var APPS = {
    shx: { title: "Cleaner SHX v4", source: "src-shx" },
    comments: { title: "Cleaner (Remove Comments)", source: "src-comments" }
  };
  var home = document.getElementById("home");
  var viewer = document.getElementById("viewer");
  var frames = document.getElementById("frames");
  var crumb = document.getElementById("crumbName");
  var built = {};
  var current = null;

  function readSource(id) {
    return document.getElementById(id).textContent.replace(/<\\\/script/g, "<" + "/script");
  }

  function ensureFrame(key) {
    if (built[key]) return built[key];
    var f = document.createElement("iframe");
    f.title = APPS[key].title;
    f.setAttribute("allow", "clipboard-write; clipboard-read");
    f.className = "hidden";
    f.addEventListener("load", function () {
      try {
        f.contentDocument.addEventListener("keydown", function (ev) {
          if (ev.key === "Escape" && current === key) goHome();
        });
      } catch (e) {}
    });
    f.srcdoc = readSource(APPS[key].source);
    frames.appendChild(f);
    built[key] = f;
    return f;
  }

  function showHome() {
    current = null;
    Object.keys(built).forEach(function (k) { built[k].classList.add("hidden"); });
    viewer.classList.add("hidden");
    home.classList.remove("hidden");
    window.scrollTo(0, 0);
  }

  function showApp(key) {
    if (!APPS[key]) { showHome(); return; }
    var f = ensureFrame(key);
    Object.keys(built).forEach(function (k) { built[k].classList.toggle("hidden", k !== key); });
    crumb.textContent = APPS[key].title;
    document.title = APPS[key].title + " — MIST Cleaner Suite";
    home.classList.add("hidden");
    viewer.classList.remove("hidden");
    current = key;
    try { f.focus(); } catch (e) {}
  }

  function route() {
    var key = (location.hash || "").replace("#", "");
    if (APPS[key]) showApp(key);
    else { document.title = "MIST Cleaner Suite"; showHome(); }
  }

  function goApp(key) { location.hash = key; }
  function goHome() {
    if (location.hash) {
      history.pushState("", document.title, location.pathname + location.search);
    }
    route();
  }

  document.getElementById("chooseShx").addEventListener("click", function () { goApp("shx"); });
  document.getElementById("chooseComments").addEventListener("click", function () { goApp("comments"); });
  document.getElementById("homeBtn").addEventListener("click", goHome);
  window.addEventListener("hashchange", route);
  window.addEventListener("popstate", route);
  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.type === "mist-home") goHome();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && current) goHome();
  });

  route();
})();
</script>
